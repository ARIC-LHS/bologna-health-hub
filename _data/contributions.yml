- id: laura-mercolini--stayhlth-01
  researcher_id: laura-mercolini
  topic_id: horizon-hlth-2027-01-stayhlth-01
  title: 'Laura Mercolini: expertise for STAYHLTH-01'
  contribution: 'Person-centred microsampling and bioanalysis for independent living. PTA Lab offers a strong bioanalytical expertise for repeated monitoring at home and in the community, combining validated methods, dried volumetric microsampling, sample stability and therapeutic drug monitoring (TDM).

    <strong class="contribution-section-title">Activities and methodologies</strong>

    Accessible sampling. Co-design self- or caregiver-assisted collection with persons with disabilities, their organisations and care partners. Adapt workflows to functional abilities, including dexterity, vision and support needs. Validate sample handling and shipment for selected matrices and analytes, including ambient transport. Define sample acceptance criteria and procedures for failed collections.

    Bioanalytical methods. Develop and validate UHPLC-MS/MS and HRMS workflows for drugs, metabolites and health-related biomarkers selected with clinical partners. Use miniaturised sample preparation and automation where appropriate. Assess comparability with conventional sampling and the influence of matrix effects and haematocrit where relevant.

    Longitudinal monitoring. Measure treatment exposure and support adherence assessment alongside treatment records. Record sampling times relative to dosing and relevant concomitant therapies. Link analytical data with clinical and functional outcomes to investigate treatment response, health complications and risks associated with loss of autonomy.

    Multicentre implementation. Provide SOPs, quality controls and analytical data harmonisation. With clinical and SSH partners, assess sampling feasibility, acceptability and burden, and the contribution of monitoring to accessible community care. Include collection success rates, assistance requirements and patient and caregiver feedback. Deliver training materials and quality-controlled datasets transferable across participating centres.

    Fit within the consortium. The expertise supports health-related research, prevention of loss of autonomy and accessible care models for the selected disability and age group. Clinical, rehabilitation, social-care, digital-health and SSH partners provide complementary expertise.

    <strong class="contribution-section-title">Relevant project experience</strong>

    Minimally invasive TDM of antidepressants in eating-disorder patients (SSR Emilia-Romagna 707/2018/SPER/AUSLBO). Lithium monitoring in bipolar-disorder patients by capillary microsampling (849/2022/SPER/AUSLBO). Peptide and growth-factor stability in dried microsamples (WADA 17A20LM; WADA 19A08LM; WADA 20A12LM).

    <strong class="contribution-section-title">Selected publications</strong>

    Capillary microsampling of CNS drugs and metabolites: Protti et al. Analyst 2020;145:5744-5753. DOI: 10.1039/D0AN01039A.

    Dried volumetric microsampling for clozapine TDM: Marasca et al. Front Psychiatry 2022;13:794609. DOI: 10.3389/fpsyt.2022.794609.

    Review of automation in microsample bioanalysis: Protti et al. Anal Chim Acta 2025;1359:344018. DOI: 10.1016/j.aca.2025.344018.'
