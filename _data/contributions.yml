    L. Mazzei; S. Ranieri; D. Silvestri; R. Greene-Cramer; C. Cioffi; G. T. Montelione; S. Ciurli. An isothermal calorimetry assay for determining steady state kinetic and Ensitrelvir inhibition parameters for SARS-CoV-2 3CL-protease. Nature Sci. Rep. 2024, 14, 32175. https://doi.org/10.1038/s41598-024-81990-y'
