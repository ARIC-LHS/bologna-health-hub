- id: maria-giulia-bacalini--stayhlth-01
  researcher_id: maria-giulia-bacalini
  topic_id: horizon-hlth-2027-01-stayhlth-01
  title: 'Maria Giulia Bacalini: expertise for STAYHLTH-01'
  contribution: 'We could contribute to the project in two complementary areas:

    Down syndrome (DS) research: We have extensive experience in developing multidisciplinary projects involving the clinical, neuropsychological, and biological characterization of individuals with DS through their life course, from childhood to adulthood. Through this work, we have established collaborations with local healthcare organizations and other Italian research institutes.

    Molecular profiling and biomarkers of aging: We offer technical expertise in epigenomics, including microarray analysis and bisulfite sequencing, as well as transcriptomics (RNA-seq) and the study of biomarkers of aging.

    Past/ongoing projects:

    “Correlazione tra genotipo e fenotipo nella trisomia 21 (sindrome di Down)”

    Ageing in people with trisomy 21: longitudinal evaluation of molecular markers and clinical, functional, neuropsychological and cognitive features.

    "Blood-based biomarkers for Alzheimer''s Disease in Down Syndrome: insights from epigenetic, glycomic and inflammatory profiles" funded by Italian Ministry of Health, Young researcher (under 40) project 2019.

    <strong class="contribution-section-title">Publications</strong>

    Alterations of gut microbiota in Down syndrome and their association with Alzheimer''s disease. Pellegrini C, … , Bacalini MG. Alzheimers Dement. 2026 Sep;22(9):e71815. doi: 10.1002/alz.71815

    Developmental Profile and Variability in Preschool-Age Children With Down Syndrome. Onnivello S, …, Pelleri MC, … , Lanfranchi S. J Intellect Disabil Res. 2026 Aug;70(8):881-886. doi: 10.1111/jir.70126

    Machine learning based analysis for intellectual disability in Down syndrome. Baldo F, Piovesan A, Rakvin M, Ramacieri G, Locatelli C, Lanfranchi S, Onnivello S, Pulina F, Caracausi M, Antonaros F, Lombardi M, Pelleri MC. Heliyon. 2023 Aug 27;9(9):e19444. doi: 10.1016/j.heliyon.2023.e19444.

    Accelerated epigenetic aging in Down syndrome. Horvath S, Garagnani P, Bacalini MG, Pirazzini C, Salvioli S, Gentilini D, Di Blasio AM, Giuliani C, Tung S, Vinters HV, Franceschi C. Aging Cell. 2015 Jun;14(3):491-5. doi: 10.1111/acel.12325'
