- id: francesco-nonino--envhlth-02
  researcher_id: francesco-nonino
  topic_id: horizon-hlth-2027-01-envhlth-02
  title: 'Francesco Nonino: expertise for ENVHLTH-02'
  contribution: 'The Unit of Epidemiology and Statistics of the IRCCS Institute of Neurological Sciences includes professionals with expertise in clinical neurology and neuroepidemiology, biostatistics, methods of biomedical research and evidence synthesis.

    Record linkage and statistical methods - The Unit has developed a long-standing experience on record linkage between clinical and administrative data. Record linkage-based algorithms have been developed and validated on a living cohort of about 2,000 subjects with Parkinson’s disease or atypical Parkinsonism in the province of Bologna since 2015. Other prospective epidemiological studies are ongoing on cohorts affected by neurological conditions, such as epilepsy and multiple sclerosis. The record linkage research model can be applied to chronic, degenerative or inflammatory neurological conditions including environmental determinants of diseases as prognostic factors.

    In this regard, the Unit is currently conducting a prospective longitudinal 3-year study (MaNDeA, Malattie Neurologiche e Determinanti Ambientali) funded by the Fondazione del Monte di Bologna e Ravenna (grant n. 2025.0163) to investigate potential environmental determinants of several neurological conditions (stroke, amyotrophic lateral sclerosis, epilepsy, Parkinson’s disease, dementia and obstructive sleep apnea syndrome). Advanced statistical methods and models are being investigated within the MaNDeA project.

    The Unit’s methodological expertise includes time-series analysis and advanced statistical models to assess short-term associations between environmental exposures and health outcomes, as well as the potential modifying role of individual and contextual characteristics. These include individual-level demographic factors and census-area-level socioeconomic factors, residential greenness measured using the Normalized Difference Vegetation Index (NDVI), and access to green spaces.

    The project is developed in collaboration with the Epidemiology, Health Promotion and Risk Communication Unit of the AUSL of Bologna and the Institute for Bioeconomy of the Consiglio Nazionale delle Ricerche (CNR). On a related topic, the Unit of Epidemiology and Statistics is currently conducting the NeuroNatureLink project, funded by the Scientific Direction of the IRCCS ISN, investigating the environmental determinants of neurological conditions in relation to the location and extent of urban green areas.

    Evidence synthesis - By hosting the editorial staff of the Cochrane Review Group on Multiple Sclerosis and Rare Diseases of the Central Nervous System and the direction of the Cochrane Italia Geographic Group, the Unit developed advanced experience in evidence synthesis (systematic reviews, scoping reviews, umbrella reviews and evidence mapping). Therefore, its contribution to the project could be relevant in creating a robust evidence base on which to develop advancements within the topic of interest and in pooling data from different centers.

    Methodological support in consensus processes – The Unit has developed a robust experience within the GRADE Working Group in the contextualization of scientific evidence within multi-stakeholder panels. Methodological support can be provided for the production of evidence-based guidance (national and international clinical practice guidelines and HTA reports). This competence may be exploited to pilot the results of a study as evidence informing the work of a decision-making panel. Members of the Units staff are involved in a GRADE project group on planetary health, investigating the effects on the planetary boundaries of interventions aimed at improving human health.

    Selected references

    Nonino F, Minozzi S, Sambati L, et al. Amyloid-beta-targeting monoclonal antibodies for people with mild cognitive impairment or mild dementia due to Alzheimer''s disease. Cochrane Database Syst Rev. 2026;4(4):CD016297. Doi:10.1002/14651858.CD016297

    Zenesini C, Cascini S, Picariello R, et al. Hypertension, Diabetes and Depression as Modifiable Risk Factors for Dementia: A Common Data Model Approach in a Population-Based Cohort, with Study Protocol and Preliminary Results. JClinMed. 2025, 14, 6622 doi: 10.3390/jcm14186622

    Muccioli L, Zenesini C, Licchetta L, et al. Causes of hospitalization and mortality in persons with epilepsy: The EpiLink Bologna cohort, Italy. Eur J Neurol. 2025;32(2):e16576.

    Ridley B, Nonino F, Baldin E, Casetta I, Iuliano G, Filippini G. Azathioprine for people with multiple sclerosis. Cochrane Database Syst Rev. 2024;12(12):CD015005.

    Piggott T, Moja L, Jenei K, et al. GRADE Concept 7: Issues and Insights Linking Guideline Recommendations to Trustworthy Essential Medicine Lists. J Clin Epidemiol. 2024 Feb;166:111241

    Ridley B, Minozzi S, Gonzalez-Lorenzo M, et al. Immunomodulators and immunosuppressants for progressive multiple sclerosis: a network meta-analysis. Cochrane Database Syst Rev. 2024;9(9):CD015443.

    Gonzalez-Lorenzo M, Ridley B, Minozzi S, et al. Immunomodulators and immunosuppressants for relapsing-remitting multiple sclerosis: a network meta-analysis. Cochrane Database Syst Rev. 2024;1(1):CD011381.

    Belotti LMB, Di Martino M, Zenesini C, et al. Impact of adherence to disease-modifying drugs in multiple sclerosis: A study on Italian real-world data. Mult Scler Relat Disord. 2023;80:105094.

    Tugwell P, Welch V, Magwood O, et al. Protocol for the development of guidance for collaborator and partner engagement in health care evidence syntheses. Syst Rev. 2023 Aug 2;12(1):134.

    Zenesini C, Belotti LMB, Baccari F, et al. Validation of Administrative Health Data Algorithms for Identifying Persons with Parkinson''s Disease and the 10-Year Prevalence Trend in Bologna, Italy. Neuroepidemiology. 2023;57(5):336-344. Doi:10.1159/000533362.'
