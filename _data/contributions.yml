- id: roberta-spadoni--envhlth-02
  researcher_id: roberta-spadoni
  topic_id: horizon-hlth-2027-01-envhlth-02
  title: 'Roberta Spadoni: expertise for ENVHLTH-02'
  contribution: 'The research group has expertise in agri-food economics, consumer behaviour, food choice, sustainable and health-oriented consumption, and the analysis of socio-behavioural determinants of individual decision-making. This expertise is particularly relevant to the socio-behavioural dimension of the human exposome and to understanding how lifestyle, food-related behaviours, risk perception, trust, socio-demographic characteristics, and environmental and health information influence individual choices and behavioural responses.

    Within HORIZON-HLTH-2027-01-ENVHLTH-02, the group can contribute to the Social Sciences and Humanities (SSH) component by investigating behavioural and socioeconomic factors associated with exposure, vulnerability, resilience, and adaptation to climate-related and environmental health risks. Particular expertise can be provided in the design and implementation of surveys, behavioural and choice experiments, consumer segmentation, willingness-to-pay analysis, and quantitative modelling of attitudes, perceptions, preferences, and behavioural intentions.

    The group can also contribute to the development and testing of communication and behavioural interventions aimed at improving public understanding of the relationships between environmental exposures, climate change, food and lifestyle choices, and health. Research activities can include the assessment of public trust and risk perception, identification of behavioural and socioeconomic heterogeneity, analysis of vulnerable population groups, and evaluation of how alternative information and communication strategies may support health-promoting, climate-resilient, and sustainable behaviours.

    The group has experience in empirical consumer research across different food and sustainability contexts, including healthy and sustainable food choices, innovative and alternative foods, consumer acceptance of new technologies, local and organic products, and the role of information, trust, and credence attributes in individual decision-making. This background enables the group to complement biomedical, environmental, epidemiological, and exposomics expertise by providing the behavioural and socioeconomic perspective required to understand how environmental and climate-related exposures interact with individual behaviours and decision-making.'
