    Poeta E., Massenzio F., Babini G., Monti B. (2025). Cell-Based Assays to Assess Neuroprotective Activity. In: Methods in Neurodegenerative Disease Drug Discovery, Neuromethods, vol. 216, pp. 207–255. https://doi.org/10.1007/978-1-0716-4232-0_10

    Marotta G., Massenzio F., Ortega J., et al. (2025). Exploration of the Neuromodulatory Properties of Fyn and GSK-3β Kinases Exploiting 7-Azaindole-Based Inhibitors. Journal of Medicinal Chemistry, 68(16), 17130–17154. https://doi.org/10.1021/acs.jmedchem.5c00629

    Barile S.N., Magnifico M.C., Poeta E., et al. (2026). Combined ketone body and glutamine supplementation restores aerobic energy production in AGC1-deficient neuronal progenitors. Cell Death & Disease, 17, 120. https://doi.org/10.1038/s41419-025-08314-4

    Balboni N., Babini G., Poeta E., et al. (2024). Transcriptional and metabolic effects of aspartate-glutamate carrier isoform 1 (AGC1) downregulation in mouse oligodendrocyte precursor cells (OPCs). Cellular & Molecular Biology Letters, 29, 44. https://doi.org/10.1186/s11658-024-00563-z'
