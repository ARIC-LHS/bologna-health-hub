- id: cristiana-caliceti--envhlth-02
  researcher_id: cristiana-caliceti
  topic_id: horizon-hlth-2027-01-envhlth-02
  title: 'Cristiana Caliceti: expertise for ENVHLTH-02'
  contribution: The research group led by Prof. Cristiana Caliceti (Associate Professor of Biochemistry, DIBINEM, University of Bologna) has a consolidated track record in designing and validating chemiluminescence- and bioluminescence-based biosensing platforms for sensitive, non-invasive biomarker quantification, directly applicable to tracking climate-related exposures across the human exposome. The group's most recent achievement is a biosensor that detects gut microbiota imbalance (dysbiosis) directly from human stool samples, offering a fast and non-invasive way to assess gut health (Punzo, Silla, Porru et al., Roda, Caliceti C., ACS Sensors 2026, 11(9):8553–8563). In parallel, the group developed a biosensor able to measure, from a simple urine sample, how much dietary polyphenols a person has consumed — a more objective alternative to food diaries — validated in human volunteers. This builds on the group's broader experience in cell-based light-emitting tests for oxidative stress
    (Caliceti et al., Anal Bioanal Chem 2016), portable smartphone- and paper-based sensors for on-site analysis (Calabria et al., Biosens Bioelectron 2017; Roda et al., Sens Actuators B Chem 2019), and an engineered glowing protein sensor for early cancer biomarker screening (Punzo, Silla et al., Biofactors 2025). The group also takes part in an Italian Space Agency-funded project developing a biosensor to monitor astronauts' cardiac health via saliva during spaceflight (2023–2026), demonstrating its ability to adapt these tools to extreme and changing environments. Altogether, this expertise in developing easy-to-use, cell- and protein-based biosensors validated directly on human samples makes the group well positioned to design and test new tools for detecting biomarkers of climate-related exposures within this Topic
