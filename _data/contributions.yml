- id: michele-protti--tool-01
  researcher_id: michele-protti
  topic_id: horizon-hlth-2027-02-tool-01-two-stage
  title: 'Michele Protti: expertise for TOOL-01'
  contribution: 'Molecular profiling and analytical validation for predictive biomarkers

    PTA Lab contributes targeted (U)HPLC-MS/MS and untargeted UHPLC-HRMS workflows for predictive biomarker development in chronic non-communicable diseases. Molecular profiling and analytical validation complement established AI methods and clinical expertise within the consortium, supporting the investigation of disease progression and treatment response.

    <strong class="contribution-section-title">Activities and methodologies</strong>

    Sampling and sample preparation. Adapt extraction and clean-up to cohort and biobank specimens, including small-volume and dried samples. Assess pre-analytical variability, matrix effects and stability using miniaturised workflows. Document collection, processing and storage conditions to identify potential sources of variation across centres and sampling time points.

    Molecular profiling. Acquire targeted measurements and untargeted metabolomic, lipidomic and exposure-related profiles. Extract molecular features and document annotation confidence, prioritising analytes relevant to the disease and clinical question. Where standards are available, confirm candidate identities through retention time and fragmentation matching.

    Data quality and integration. Provide traceable feature matrices, quality-control results and analytical metadata. Assess drift, batch effects and missingness; agree preprocessing and normalisation with biostatistics and AI partners for integration with clinical, imaging and longitudinal data. Use blanks, reference materials and pooled quality-control samples where appropriate to monitor analytical performance.

    Targeted analytical validation. Translate prioritised candidates into quantitative assays and assess selectivity, sensitivity, precision, accuracy and stability. Analyse independent validation samples with clinical partners, supporting the evaluation of prognostic or predictive value against relevant outcomes. Define assay acceptance criteria and document reproducibility across analytical batches.

    Fit within the consortium. The contribution requires access to existing cohorts, biobanks and clinical datasets through consortium partners, with limited additional measurements where justified. Clinical, AI, biostatistics, data-governance and regulatory partners support clinical utility assessment.

    <strong class="contribution-section-title">Relevant project experience</strong>

    Tryptophan catabolism and amyotrophic lateral sclerosis (MIUR PRIN 2017, 20173EAZ2Z); therapeutic monitoring of antidepressants (SSR Emilia-Romagna, 707/2018/SPER/AUSLBO); lithium monitoring by microsampling (849/2022/SPER/AUSLBO).

    <strong class="contribution-section-title">Selected publications</strong>

    Carvalho LB et al. Normalization methods in mass spectrometry-based analytical proteomics: A case study based on renal cell carcinoma datasets. Talanta. 2024;266:124953. DOI: 10.1016/j.talanta.2023.124953.

    Marasca C et al. Volumetric Absorptive Microsampling of Blood for Untargeted Lipidomics. Molecules. 2021;26(2):262. DOI: 10.3390/molecules26020262.

    Protti M et al. Targeted quantitative metabolic profiling of brain-derived cell cultures by semi-automated MEPS and LC-MS/MS. Journal of Pharmaceutical and Biomedical Analysis. 2023;236:115757. DOI: 10.1016/j.jpba.2023.115757.'
