- id: arrigo-francesco-giuseppe-cicero--disease-01
  researcher_id: arrigo-francesco-giuseppe-cicero
  topic_id: horizon-hlth-2027-02-disease-01-two-stage
  title: 'Arrigo Francesco Giuseppe Cicero: expertise for DISEASE-01'
  contribution: 'Candidate concept | PRECISION-CARDIO: Prospective, multicentre early-stage clinical validation of a refined, personalised cardiometabolic care intervention for patients with established atherosclerotic cardiovascular disease (ASCVD), with relevant diabetes/chronic kidney disease comorbidity. Combine clinician-led therapy optimisation, structured lifestyle support, non-invasive vascular monitoring and an explainable AI-enabled monitoring/decision-support component. The intervention and its clinical safety/efficacy proof-of-concept must be identified and confirmed with consortium partners before submission.

    Available assets / feasibility: A Bologna specialist lipid/cardiovascular clinic has an estimated pool of ~800 high-/very-high-risk patients treated with PCSK9 inhibitors, to be audited for documented ASCVD, eligibility, baseline therapy, follow-up and willingness to participate. The number is a potential screening pool, not a claimed sample size or established eligible trial cohort.

    Trial-specific activities: Co-design a protocol-driven phase-II/early-stage clinical study of a novel/refined intervention (not a marketed-drug head-to-head comparison); support recruitment and safety assessment; phenotype lipid/metabolic risk and multimorbidity; harmonise LDL-C, apoB, Lp(a), BP, adherence, patient-reported outcomes, and exploratory FMD/PWV vascular endpoints; coordinate central quality control, prespecified longitudinal analyses and independent outcome review.

    Digital / explainable AI: With AI, engineering and healthcare partners, assess a clinician-supervised adaptive monitoring tool integrating longitudinal biomarkers, structured treatment data and optional home BP/activity data. Predefine interpretability, calibration, fairness, external validation, cybersecurity, GDPR/EHDS-aligned FAIR data management and clinician override; quantify incremental value versus a simple protocol-based approach.

    Implementation / consortium capacity: Longstanding clinical-trial and cohort experience; collaborations through the International Lipid Expert Panel (ILEP) and European Regional Federation of the International Atherosclerosis Society (IAS) can support identification of multicountry trial sites and clinical, regulatory, AI/SME, SSH, health-economic and patient-organisation partners. Contacts are prospective; no consortium commitments are presumed.

    Track record / projects: Brisighella Heart Study; AVATAR lipid clinic observational programme; Global Pulse Wave Velocity Study Group; Homozygous Familial Hypercholesterolaemia International Registry; GCP trials LAPLACE-2, OSLER-2, GAUSS-2, VICTORION-2P, Lp(a) HORIZON and OCEAN.

    Selected publications: Ruscica et al., J Am Heart Assoc 2017, PCSK9 and arterial stiffness, doi:10.1161/JAHA.117.005764; Penson et al./ILEP, Eur Heart J 2022, statin intolerance, doi:10.1093/eurheartj/ehac015; Silla et al., Antioxidants 2023, evolocumab and arterial stiffness, doi:10.3390/antiox12030578; Lu et al./Global PWV Study Group, EBioMedicine 2023, doi:10.1016/j.ebiom.2023.104619.

    Call readiness / patents: Critical prerequisites: completed safety/efficacy proof-of-concept, completed preclinical work, draft clinical trial protocol and evidence of preliminary ethics/regulatory consultations. These are NOT yet evidenced for the proposed integrated intervention; seek a proof-of-concept-ready partner. No relevant patents asserted.'
