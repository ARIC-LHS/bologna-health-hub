- id: milena-raffi--stayhlth-01
  researcher_id: milena-raffi
  topic_id: horizon-hlth-2027-01-stayhlth-01
  title: 'Milena Raffi: expertise for STAYHLTH-01'
  contribution: 'Expertise in relation to the topic

    Our research focuses on human and exercise physiology, sensory contributions to postural control, balance and movement, and the impact of chronic conditions on functional abilities. Experience includes work with people with diabetes and Parkinson’s disease. We can connect physiological assessment with adapted physical activity and community participation to support autonomy, wellbeing and inclusion across the life course.

    IDEAL Sport4All and collaboration with UISP

    A central asset is Milena Raffi’s work with UISP Bologna within IDEAL Sport4All (Inclusion, Disability and Equality for Accessible Leisure), an Erasmus+ Sport project promoting accessible and inclusive sport for persons with disabilities. This collaboration provides experience at the interface between research, grassroots sport and community organisations. The project combines inclusive sporting activities, training for sports practitioners, awareness-raising and practical resources, including a training manual and toolkit. It offers a relevant foundation for translating knowledge on physical activity into accessible opportunities for participation in everyday community settings.

    Partner network and community connections

    Prof. Milena Raffi has an established collaboration and direct contact with several institution with expertise in addressing disability, bringing complementary experience in inclusive sport, community physical activity and inclusive communication. The relationship with UISP provides a route to engage this network and explore collaboration with sports associations, educators and local stakeholders. These connections could support participatory design, community delivery, practitioner training and dissemination within a future consortium.

    Activities and methodology offered

    We can develop assessment protocols for mobility, balance, postural control and physiological responses to exercise, using functional tests and instrumented measurements appropriate to participants’ abilities. Repeated assessments can support evaluation of changes in functional capacity alongside participation, perceived autonomy and quality of life, in collaboration with clinical and social science partners.

    We can contribute to co-designing, implementing and evaluating adapted physical activity programmes with persons with disabilities, their representative organisations, families, carers and community practitioners. Activities would address individual goals, accessibility barriers and sedentary behaviour, with particular relevance to young people transitioning to adulthood and older persons. Collaboration with nutrition specialists can support integrated activity and nutrition programmes tailored to functional needs and associated chronic conditions.

    Building on past experience, we can contribute to training sports practitioners and educators, adapting accessible materials, and identifying barriers and facilitators to sustained participation. Our proposed role links functional assessment with inclusive community programmes, helping evaluate how physical activity can support daily autonomy, social participation and the prevention of further functional decline.'
