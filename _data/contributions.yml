- id: barbara-zambelli--disease-05
  researcher_id: barbara-zambelli
  topic_id: horizon-hlth-2027-01-disease-05
  title: 'Barbara Zambelli: expertise for DISEASE-05'
  contribution: 'Our research group combines protein biochemistry, biophysics and bioinorganic chemistry to investigate molecular mechanisms relevant to therapeutic intervention. Our expertise encompasses recombinant protein production, protein–protein and protein–ligand interactions, enzyme activity and inhibition, metal homeostasis, and the structural and functional properties of intrinsically disordered regions.

    Our experimental capabilities include construct design, cloning and site-directed mutagenesis; recombinant expression in bacterial systems; chromatographic purification; and biochemical and biophysical characterisation using solution NMR spectroscopy, crystallography, isothermal titration calorimetry (ITC), circular dichroism, fluorescence spectroscopy and light scattering. These approaches enable the determination of binding affinity and stoichiometry, protein structure and oligomerisation, conformational changes and stability, and the functional consequences of molecular interactions.

    We offer biochemical and biophysical support for the characterisation of viral or host protein targets and candidate inhibitors relevant to the viruses specified in the topic. Tasks could include producing recombinant targets and functional domains; developing target-specific activity and binding assays; measuring compound affinity and inhibition; determining the three-dimensional structure, and investigating changes in protein conformation or molecular interactions upon ligand binding. Comparative analysis of wild-type and mutant proteins could help identify residues contributing to target engagement and compound activity. These activities would provide mechanistic evidence for candidate prioritisation and optimisation, in collaboration with partners responsible for medicinal chemistry, antiviral assays and infection models. Our published studies on protein structure, dynamics and molecular recognition provide the methodological background for this contribution.

    <strong class="contribution-section-title">Relevant publications</strong>

    Spronk C.A.E.M. et al., including Zambelli B. (2018). Structure and dynamics of Helicobacter pylori nickel-chaperone HypA: an integrated approach using NMR spectroscopy, functional assays and computational tools. Journal of Biological Inorganic Chemistry, 23, 1309–1330. https://doi.org/10.1007/s00775-018-1616-y

    Carosella N., Pastorello C., Waeytens J., Beniamino Y., Roncassaglia V., Serra L., Raussens V., Mileo E., Ciurli S., Zambelli B. (2026). Phosphorylation disrupts the interaction between the intrinsically disordered region of the oncogenic NDRG1 and lipid vesicles. Protein Science, 35, e70510. https://doi.org/10.1002/pro.70510

    L. Mazzei, S. Ranieri, D. Silvestri, G.T. Montelione, S. Ciurli. Decoding Enzyme–Inhibitor Kinetic Mechanisms by Isothermal Titration Calorimetry: The Case of SARS-CoV-2 3CLpro. Anal. Chem. (2026) 98 (26): 19520–19532. https://doi.org/10.1021/acs.analchem.6c00471

    L. Mazzei; S. Ranieri; D. Silvestri; R. Greene-Cramer; C. Cioffi; G. T. Montelione; S. Ciurli. An isothermal calorimetry assay for determining steady state kinetic and Ensitrelvir inhibition parameters for SARS-CoV-2 3CL-protease. Nature Sci. Rep. 2024, 14, 32175. https://doi.org/10.1038/s41598-024-81990-y'
