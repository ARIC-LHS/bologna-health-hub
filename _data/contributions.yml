- id: monica-forni--envhlth-02
  researcher_id: monica-forni
  topic_id: horizon-hlth-2027-01-envhlth-02
  title: 'Monica Forni: expertise for ENVHLTH-02'
  contribution: 'The AlmaMICROBIOME Biobank, part of the BBMRI-ERIC research infrastructure through the Italian National Node, is hosted by the Department of Medical and Surgical Sciences at the University of Bologna. Established with NextGenerationEU funding under Italy’s National Recovery and Resilience Plan (PNRR), through the PNRR Strengthening BBMRI.it project, AlmaMICROBIOME provides a research infrastructure supporting the integration of microbiome profiles with clinical, lifestyle and environmental exposure FAIR data.

    As a dynamic interface between the host and the environment, the human microbiome may reflect the cumulative effects of the exposome, including those associated with climate change. By preserving well-characterized biospecimens and associated longitudinal metadata, AlmaMICROBIOME can support the identification of microbiome signatures associated with environmental exposures, their temporal dynamics, and potential implications for human health.

    Through PNRR funding, AlmaMICROBIOME has developed dedicated facilities for the collection of biological samples and host metadata from clinical and population-based studies, as well as for sample preservation, processing, and analysis. These include a bioinformatics facility for high-resolution microbiome profiling and a culturomics platform for investigating host–microbiome interactions.

    The Biobank builds on the long-standing expertise of the Human Microbiomics Unit at the Department of Medical and Surgical Sciences, which has been conducting microbiome research for several years. Its research activities encompass microbial community profiling, metagenomics, bioinformatics and culturomics, as well as investigations into the role of the microbiome in the onset and progression of a range of diseases, and in responses to therapeutic interventions, including chemoimmunotherapy and faecal microbiota transplantation. The Unit’s research activity is documented by >70 publications over the past 5 years.

    The Unit is currently involved in a broad portfolio of competitive research activities, including 3 EU projects, >10 national projects (e.g., AIRC, PRIN, Ricerca Finalizzata, Ricerca Corrente, POS Trajectory 5, and PNRR), and 3 commissioned research projects with pharmaceutical and nutraceutical companies.

    Of particular relevance to the proposed Horizon Europe topic is the Unit''s involvement in TRIGGER, where the effects of climate-related environmental exposures on human microbiome composition, diversity and function are investigated, together with their potential implications for respiratory and cardiovascular health. This experience provides a strong foundation for contributing to studies aimed at characterising microbiome responses to climate-related exposures and understanding their role in human health. The Unit is also involved in REALIGN (Grant Agreement in preparation), which integrates microbiome data into an AI-driven precision medicine approach to Long COVID and related post-infectious conditions.

    The team actively collaborates with BBMRI-ERIC on the standardisation of procedures for the collection, storage, and analysis of different sample types for microbiome research, as well as on the development of self-assessment surveys on relevant CEN/TS and ISO standards.

    <strong class="contribution-section-title">Running European projects</strong>

    TRIGGER, Solutions for mitigating climate-induced health threats (GA no. 101057739), HORIZON-HLTH-2021-ENVHLTH-02: This project aims to deepen the current understanding of the complex linkage between climate change, human health, and ecosystems (through the creation of climate-health-connection labs) to ultimately use this knowledge for society to advance as a whole

    REALIGN, Redefining post-infectious illness through AI, biology and precision management (GA in preparation), HORIZON-HLTH-2026-01-DISEASE-03: This project aims to improve the prevention, diagnosis and management of Long COVID and selected comparator post-infectious conditions through a mechanism-driven precision medicine approach that also incorporates microbiome data.

    CaBRIOH, Capacity building in research infrastructures towards one health (GA in preparation), HORIZON-INFRA-2025-01-DEV-01 - Research infrastructures. This project unites leading actors across the ESFRI Health & Food domain. At its core is BBMRI-ERIC with its 26 National Nodes focusing on human and animal health, complemented by EIRENE RI, with environmental exposure and human exposome research.

    <strong class="contribution-section-title">Three most relevant publications from the past 5 years</strong>

    Porcari et al., International consensus statement on microbiome testing in clinical practice. Lancet Gastroenterol Hepatol. 2025;10(2):154-167. An international multidisciplinary expert panel was convened to standardise best practices of microbiome testing for clinical implementation, including recommendations on general principles and minimum requirements for their provision, indications, pre-testing protocols, method of analyses, reporting of results, and potential clinical value.

    Di Paola et al., Interplay between WNT/PI3K-mTOR axis and the microbiota in APC-driven colorectal carcinogenesis: data from a pilot study and possible implications for CRC prevention. J Transl Med. 2024;22(1):631. This work investigated the interplay between the PI3K/mTOR pathway and the oral, faecal and mucosal microbiota composition within each step of colorectal carcinogenesis (including familial adenomatous polyposis).

    Masetti et al., Gut microbiota diversity before allogeneic hematopoietic stem cell transplantation as a predictor of mortality in children. Blood. 2023;142(16):1387-1398. This work involved 16S rRNA amplicon sequencing of stool samples from a multicentre cohort of 90 paediatric allo-HSCT recipients, including a global-to-local networking approach.'
