- id: sabrina-valente--envhlth-02
  researcher_id: sabrina-valente
  topic_id: horizon-hlth-2027-01-envhlth-02
  title: 'Sabrina Valente: expertise for ENVHLTH-02'
  contribution: 'Expertise in cell biology including human vascular wall adult stromal/stem (isolation and culture, morphological, phenotypical and molecular characterization, multi-lineage differentiation in adipogenic, osteogenic, chondrogenic, leiomyogenic, and angiogenic cells and immunomodulatory assay)

    <strong class="contribution-section-title">Experimental activities and methodology</strong>

    Cell culture: maintenance and in vitro manipulation of various primary cells and cell lines (tumor and non-tumor cells), co-culture cells of different type of cells (direct contact and with transwell), organ culture

    3D cell culture: generation of spheroids using single and multi-cell types; cell-biomaterial scaffolds; in vitro angiogenesis on Matrigel (tube formation)

    Cellular analysis: viability, morphology, proliferation and migration; scratch wound healing assay; flow cytometry (immunophenotype characterization and cell cycle analysis)

    Microscopy: light, fluorescent, confocal, and Transmission and Scanning electron microscopy

    Histology on cells, spheroids, tissues, and engineering cell-scaffolds: histological staining, immunocytochemistry, immunohistochemistry, immunofluorescence, including sample processing, sectioning, microscope observation, image acquisition and analysis

    Ultrastructure on cells, spheroids, tissues, and engineering cell scaffolds: sample processing, resin embedding, ultramicrotome sectioning, ultrastructural examination, immunogold labeling

    Molecular biology: RNA isolation, RT-PCR, Real Time-PCR, Western Blot

    Biochemical (ELISA) and cell viability assays (Alamar Blue, PrestoBlue, MTT, TUNEL assay and LIVE/DEAD)

    Morphometric and semi-quantitative analysis

