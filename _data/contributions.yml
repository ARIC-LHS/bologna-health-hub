- id: alessandra-tolomelli--ind-01
  researcher_id: alessandra-tolomelli
  topic_id: horizon-hlth-2027-01-ind-01
  title: 'Alessandra Tolomelli: expertise for IND-01'
  contribution: 'The research group has extensive expertise in the synthesis of oligopeptides, covering a broad range of synthetic methodologies currently employed in industrial practice for this class of compounds, thanks to several collaborative project with pharmaceutical companies. Its capabilities encompass both manual and automated synthesis, supported by dedicated instrumentation, including an automated peptide synthesizer. This combination of expertise and technical resources enables the group to select and optimize the most appropriate synthetic approach according to the specific structural features and requirements of each target molecule. In particular, the sustainable protocols have been optimized with the aim to overcome the issues of peptide synthesis related to large use of toxic solvent and excess of reagents.

    The group''s activities extend beyond the synthesis stage to encompass the complete downstream processing at lab scale of the target compounds, including their isolation, purification, and comprehensive structural characterization. In particular, NMR spectroscopy is routinely employed to support the structural elucidation and characterization of the synthesized oligopeptides, providing detailed information on their molecular structure and chemical identity. Furthermore, the group has established expertise in the analytical assessment of oligopeptide purity by high-performance liquid chromatography (HPLC). Compound-specific analytical methods are developed and optimized to ensure reliable and reproducible evaluation of sample purity. This integrated approach, combining synthetic expertise, purification capabilities, advanced spectroscopic characterization, and tailored chromatographic analysis, enables the group to manage the entire workflow from oligopeptide synthesis to the characterization
    and quality assessment of the final products.

    LC-MS, LC, “in-flow” system, peptide synthesizer, electrochemical reactors, in-flow hydrogenation systems and all the equipment for organic synthesis, SPPS and LPPS are available in the lab for exclusive use. The group is also part of the research network of the Department, sharing NMR instruments, MALDI-TOF and other equipment that can support oligopeptide and small biologics analysis.

    The background and expertise of the PI and of the group is assessed by the number of paper and patents in this area, some recent products are reported below:

    Patents:

    “Process for the Synthesis of Etelcalcetide” EP3875466 (A1),

    “Amino Deprotection Using 3-(Diethylamino)propylamine” US Pat. App. US202117547076 20211209, European Patent Application EP4011901 (A1) Chinese Patent Application CN115181158 (A).

    “Method For The Synthesis Of A Peptide With Amino Acids Having Basic Side-Chains” WO2026002729A1.

    “Peptides, Peptidic Nucleic Acids (Pna) And Oligonucleotides Synthesis Assisted By Membrane Extraction” EP4516392A1.

    Papers:

    “Solid phase peptide synthesis using side-chain unprotected arginine and histidine with Oxyma Pure/TBEC in green solvents”, Green Chem. 2024, 26, 10929-10939, DOI 10.1039/d4gc03209h.

    “Fast Solution-Phase and Liquid-Phase Peptide Syntheses (SolPSS and LPPS) Mediated by Biomimetic Cyclic Propylphosphonic Anhydride (T3P®)” Molecules, 2023, 28, 7183.

    “From green innovations in oligopeptide to oligonucleotide sustainable synthesis: differences and synergies in TIDES chemistry”, Green Chem., 2023, 25, 1217-1236. doi.org/10.1039/D2GC04547H.

    “Sustainability in peptide chemistry: current synthesis and purification technologies and future challenges", Ferrazzano, L.; Catani, M.; Cavazzini, A.; Martelli, G.; Corbisiero, D.; Cantelmi, P.; Fantoni, T.; Mattellone, A.; De Luca, C.; Felletti, S.; Cabri, W. Tolomelli, A. Green Chem. 2022, 24, 975-1020, 10.1039/D1GC04387K.'
