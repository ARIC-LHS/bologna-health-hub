- id: alessandra-stancari--care-02
  researcher_id: alessandra-stancari
  topic_id: horizon-hlth-2027-01-care-02
  title: 'Alessandra Stancari: expertise for CARE-02'
  contribution: 'Clinical expertise and target populations

    The Clinical Pharmacy, Production and Research Unit has extensive expertise in medication safety, polypharmacy management, medication review and medicines optimisation across different healthcare settings.

    Over the last few years, the Unit has developed and implemented research projects focused on pharmacist-led Medication Review in vulnerable patient populations, including nephrology, infectious diseases and cardiovascular medicine. Dedicated clinical pharmacists are routinely involved in the review of pharmacological treatments of both inpatients and outpatients, with the aim of improving prescribing appropriateness, reducing potentially inappropriate medications (PIMs), preventing drug-drug interactions (DDIs) and minimising medication-related risks.

    The Unit manages patients with multimorbidity and complex therapeutic regimens who are exposed to a high risk of adverse drug reactions (ADRs), treatment-related hospitalisations and poor therapeutic outcomes. Particular attention is devoted to patients receiving multiple medications and those undergoing transitions of care, including hospital discharge and specialist outpatient follow-up.

    Clinical resources and real-world data

    The Unit has access to real-world clinical data collected through routine clinical pharmacy activities and research projects on Medication Review and medicines optimisation.

    Dedicated pharmacists routinely document medication-related problems, drug-drug interactions, potentially inappropriate prescribing, pharmacist interventions and clinical outcomes, providing a valuable source of real-world evidence for observational and interventional studies.

    Proposed activities and methodology

    Contribute to the identification of patients at high risk of ADRs through structured medication review, medication reconciliation and comprehensive assessment of pharmacological treatments.

    Evaluate polypharmacy-related risks, including drug-drug interactions, therapeutic duplications, contraindications, medication burden and potentially inappropriate medications.

    Support the development and validation of personalised approaches to pharmacotherapy by integrating clinical characteristics, comorbidities, medication history and individual risk factors into therapeutic decision-making.

    Contribute to the development and validation of clinical decision-support tools, risk prediction models and AI-based approaches aimed at identifying patients at increased risk of ADRs associated with polypharmacy.

    Collaborative background

    the Unit is particularly interested in collaborating with partners in clinical pharmacology, pharmacogenomics, artificial intelligence, digital health, epidemiology and health economics to develop innovative strategies for reducing ADRs associated with multiple medication use.

    Oral comunication and posters

    Trapanese M. , Traficante M., Stancari A., Comai G. et al. “Collaborazione farmacista – medico nel setting Nefrologico: esperienza e risultati preliminari di un progetto pilota di medication review (MR) e deprescribing”. Oral comunication at SIF Congress in Verona June24-25 , 2025.

    Trapanese M. , Traficante M., Stancari A., Comai G. et al. “Progetto di medication review nell’ambulatorio post-trapianto di rene: sinergia tra medico e farmacista a garanzia dell’uso sicuro ed efficace dei farmaci” . Oral communication at SIFaCT - II National Conference of the Chronicity Network, Ravenna April 30, 2026.

    Fiorni G, Trapanese M, Traficante M, Stancari A., Potena L. et al. “Polifarmacoterapia nello scompenso cardiaco cronico: l’impatto della medication review e il ruolo del team multidisciplinare”. Poster t thel 127° Congress SIMI in Rimini October 2-4 , 2026.

    Trapanese M., Traficante M., Fiorini G., Stancari A., Potena L. et al. “Sicurezza delle cure: impatto della medication review e del ruolo del farmacista clinico sulla gestione delle politerapie” . Poster at the 14th National SIFaCT Congress in Trento, October 8-10, 2026 and 47° National SIFO Congress in Rome, November 5-8, 2026.

    Trapanese M., Lunghi C., Donati M., Stancari A., Comai G. et al. ‘’Inserimento del farmacista in un team clinico: risultati preliminari della creazione di un modello collaborativo basato sull’integrazione delle competenze” . Posters at the 14th National SIFaCT Congress in Trento, October 8-10, 2026, and the 47° National SIFO Congress in Rome, November 5-8, 2026.

    Fiorini G., Trapanese M., Traficante M., Potena L., Stancari A., et al. “Polypharmacy in Chronic Heart Failure: The Impact of Medication Review and the Role of the Multidisciplinary Team”. Oral comunication at 43° SIF Congress in Torino, November 25-28, 2026.'
