- id: barbara-zambelli--disease-06
  researcher_id: barbara-zambelli
  topic_id: horizon-hlth-2027-01-disease-06
  title: 'Barbara Zambelli: expertise for DISEASE-06'
  contribution: 'Our research group combines protein biochemistry, biophysics and bioinorganic chemistry to investigate molecular mechanisms relevant to therapeutic intervention. Our expertise encompasses recombinant protein production, protein–protein and protein–ligand interactions, enzyme activity and inhibition, metal homeostasis, and the structural and functional properties of intrinsically disordered regions.

    Our experimental capabilities include construct design, cloning and site-directed mutagenesis; recombinant expression in bacterial systems; chromatographic purification; and biochemical and biophysical characterisation using solution NMR spectroscopy, crystallography, isothermal titration calorimetry (ITC), circular dichroism, fluorescence spectroscopy and light scattering. These approaches enable the determination of binding affinity and stoichiometry, protein structure and oligomerisation, conformational changes and stability, and the functional consequences of molecular interactions.

    We offer research-scale production and characterisation of selected antigens or domains compatible with bacterial expression, supporting the further characterisation of existing antibody candidates. Our protein-production expertise could also be applied to developing expression and purification workflows for recombinant nanobodies and, where appropriate, scFv or Fab fragments, using sequences supplied by consortium partners.

    Experimental tasks could include construct optimisation, purification, assessment of solubility, oligomeric state and conformational stability, and quantitative analysis of antigen–antibody binding. Domain constructs and site-directed mutants could support investigation of binding determinants, subject to verification of correct folding. These activities would complement neutralisation assays and preclinical studies performed by specialist partners. Expression systems would be selected according to the requirements of each construct, with eukaryotic production provided by consortium partners where necessary. This contribution builds on our established expertise in recombinant proteins and molecular interaction analysis.

