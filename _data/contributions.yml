- id: milena-raffi--envhlth-02
  researcher_id: milena-raffi
  topic_id: horizon-hlth-2027-01-envhlth-02
  title: 'Milena Raffi: expertise for ENVHLTH-02'
  contribution: '<strong class="contribution-section-title">Expertise and scientific background</strong>

    Our research combines human neurophysiology and exercise physiology, with expertise in cardiovascular and metabolic responses to exercise, autonomic adaptation, neuromuscular function and postural control. Published work includes the effects of dehydration on metabolic and neuromuscular function during cycling, cardiovascular adaptation to training, and motor control in both healthy people or patients. This background supports a contribution to studying how climate-related exposures interact with physical activity and pre-existing conditions to influence physiological responses and functional vulnerability.

    <strong class="contribution-section-title">Contribution to climate and exposome research</strong>

    We can contribute physiological and behavioural phenotyping within longitudinal exposome studies led by the consortium. A specific focus would be the interaction of heat and humidity with activity patterns and/or sedentary behaviour, examining cardiovascular strain, fatigue, recovery and functional performance. Physiological measures could be linked to concurrent environmental exposure data, including air pollution where available, to investigate responses to multiple exposures and differences between individuals.

    Activities and methodology offered

    We can design and conduct standardised assessments at rest, during exercise and recovery, including cardiovascular and autonomic measures, metabolic responses, surface electromyography and stabilometric evaluation of balance. Repeated measurements would allow assessment of within-person changes across exposure periods and seasons. In collaboration with environmental and digital health partners, laboratory assessments could be complemented by wearable monitoring of activity records, with harmonised timing and protocols to support integration with cohort data. We can contribute to selecting and interpreting candidate functional indicators of susceptibility and adaptation, examining the role of age, sex, fitness, habitual activity and chronic conditions. Working with epidemiology and statistics partners, these measures could be analysed alongside clinical, environmental and socioeconomic data to distinguish exposure patterns from individual responses.

    Translation and engagement

    Our experience in physical activity and health education, including coordination of DUSE project (Counteracting diabetes using interdisciplinary educative programs, funded by the EU4H program), BE-NEW project (Exercise for diabetes: beneficial effect of new educational and physical activity programs) and with several institutions, can support participant engagement and communication. We can help translate consortium findings into practical guidance on physical activity and recovery under changing environmental conditions, tailored to different abilities and social contexts.

    Selected supporting publications

    Campa F, Piras A, Raffi M, et al. (2020). The effects of dehydration on metabolic and neuromuscular functionality during cycling. International Journal of Environmental Research and Public Health, 17, 1161.

    Piras A, Persiani M, Damiani N, Perazzolo M, Raffi M (2015). Peripheral heart action (PHA) training as a valid substitute to high intensity interval training to improve resting cardiovascular changes and autonomic adaptation. European Journal of Applied Physiology, 115, 763–773.'
