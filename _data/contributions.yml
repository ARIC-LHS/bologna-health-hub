- id: barbara-monti--envhlth-02
  researcher_id: barbara-monti
  topic_id: horizon-hlth-2027-01-envhlth-02
  title: 'Barbara Monti: expertise for ENVHLTH-02'
  contribution: 'Our laboratory has consolidated expertise in the development and application of cellular models to investigate neurotoxicity, neuroprotection, neuroinflammation, and drug-induced immunomodulatory effects. A recent focus of our research is the use of patient-derived induced pluripotent stem cells (iPSCs) and their differentiation into neural cell types, including neurons and neuronal progenitors, providing human-relevant models to investigate disease mechanisms and individual cellular responses to pharmacological treatments.

    We routinely employ primary and immortalized cell cultures to evaluate the biological activity of small molecules developed by collaborating research groups. Our experimental approaches include cell-based assays to assess cell viability, neurotoxicity, neuroprotective effects, inflammatory responses, and modulation of neuronal and glial functions. We are also expanding our capabilities towards more complex models, including iPSC-derived microglia and three-dimensional brain organoids.

    The laboratory has additional expertise in the investigation of extracellular vesicles (EVs) and microRNAs (miRNAs), including EV characterization and miRNA profiling, to study intercellular communication and neuroinflammatory mechanisms. These approaches can support the identification of molecular biomarkers of drug-induced toxicity and potential therapeutic targets.

    In relation to the proposed topic, our laboratory could contribute to the development of patient-specific neuronal models and the experimental assessment of neurotoxic, neuroprotective, and immunomodulatory effects of individual drugs/ antibodies and or combinations. By integrating functional cellular assays with the analysis of EVs and miRNAs, we could investigate mechanisms underlying adverse neurological drug/ antibodies reactions, identify potential biomarkers of individual susceptibility, and explore therapeutic strategies to mitigate adverse effects associated with polypharmacy.

    <strong class="contribution-section-title">Relevant publications</strong>

    De Chirico F., Massenzio F., Petralla S., et al. (2026). Inflammatory stimulation remodels microglial extracellular vesicle miRNA cargo and selectively modulates recipient microglial responses. Cellular and Molecular Neurobiology. https://doi.org/10.1007/s10571-026-01823-6

    Poeta E., Massenzio F., Babini G., Monti B. (2025). Cell-Based Assays to Assess Neuroprotective Activity. In: Methods in Neurodegenerative Disease Drug Discovery, Neuromethods, vol. 216, pp. 207–255. https://doi.org/10.1007/978-1-0716-4232-0_10

    Marotta G., Massenzio F., Ortega J., et al. (2025). Exploration of the Neuromodulatory Properties of Fyn and GSK-3β Kinases Exploiting 7-Azaindole-Based Inhibitors. Journal of Medicinal Chemistry, 68(16), 17130–17154. https://doi.org/10.1021/acs.jmedchem.5c00629

    Barile S.N., Magnifico M.C., Poeta E., et al. (2026). Combined ketone body and glutamine supplementation restores aerobic energy production in AGC1-deficient neuronal progenitors. Cell Death & Disease, 17, 120. https://doi.org/10.1038/s41419-025-08314-4

    Balboni N., Babini G., Poeta E., et al. (2024). Transcriptional and metabolic effects of aspartate-glutamate carrier isoform 1 (AGC1) downregulation in mouse oligodendrocyte precursor cells (OPCs). Cellular & Molecular Biology Letters, 29, 44. https://doi.org/10.1186/s11658-024-00563-z'
