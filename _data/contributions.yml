- id: marco-montevecchi--tool-01
  researcher_id: marco-montevecchi
  topic_id: horizon-hlth-2027-02-tool-01-two-stage
  title: 'Marco Montevecchi: expertise for TOOL-01'
  contribution: 'The Periodontology Unit has clinical and research expertise in periodontal and peri-implant diseases, with particular focus on clinical phenotyping and on the investigation of microbiological and host-response markers associated with inflammatory disease activity and progression.

    The group has experience in clinical research integrating periodontal and peri-implant phenotyping with molecular microbiological data obtained through PCR-based and DNA probe methodologies. Laboratory analyses in previous and ongoing studies have been performed in collaboration with external specialised laboratories, while the research group has been responsible for study design, patient recruitment and clinical characterisation, standardized biological sampling, clinical data collection, and interpretation and integration of laboratory findings with clinical outcomes.

    This research background has led to the ongoing investigator-led clinical project MMP8imp - "Diagnostic role of MMP-8 and microbiological testing in peri-implant tissue health", led by Marco Montevecchi as Principal Investigator and formally approved by the competent Ethics Committee and healthcare authority. The project investigates the integration of clinical parameters, microbiological profiles and the host-response biomarker Matrix Metalloproteinase-8 (MMP-8) for improved discrimination between peri-implant health, peri-implant mucositis and peri-implantitis.

    Preliminary findings from MMP8imp, presented at EuroPerio11 and published in the Journal of Clinical Periodontology, showed significant differences in MMP-8 levels among the three clinical conditions and an association between MMP-8 and probing depth, supporting the potential value of integrating conventional clinical assessment with biological markers.

    Potential contribution to a consortium

    • Accurate periodontal and peri-implant clinical phenotyping and patient stratification;

    • Patient recruitment and prospective/longitudinal clinical monitoring;

    • Standardized collection of peri-implant crevicular fluid and microbiological samples;

    • Design and implementation of clinical protocols investigating microbiological and host-response biomarkers;

    • Integration and clinical interpretation of microbiological, biomarker and phenotypic data;

    • Prospective clinical validation of candidate multimodal biomarkers.

    The group is particularly interested in collaborating with partners providing specialised biomarker and molecular analysis platforms, as well as established AI and machine-learning methodologies, to integrate clinical, microbiological and host-response data into multimodal predictive models of disease progression and treatment response.

    Selected relevant research outputs

    Lo Bianco L, Montevecchi M, Checchi V, Checchi L. The Role of MMP-8 on the Health Status of Peri-Implant Tissues: Preliminary Results. J Clin Periodontol. 2025;52(Suppl 28):355-356. doi:10.1111/jcpe.14158.

    Montevecchi M, Valeriani L, Salvadori MF, Stefanini M, Zucchelli G. Excess cement and peri-implant disease: A cross-sectional clinical endoscopic study. J Periodontol. 2025;96:965-973. doi:10.1002/JPER.24-0510.

    Lo Bianco L, Montevecchi M, Ostanello M, Checchi V. Recognition and treatment of peri-implant mucositis: Do we have the right perception? A structured review. Dent Med Probl. 2021;58(4):545-554. doi:10.17219/dmp/136359.

    Montevecchi M, Valeriani L, Gatto MR, D''Alessandro G, Piana G. Subgingival pathogens in chronic periodontitis patients affected by type 2 diabetes mellitus: a retrospective case-control study. J Periodontal Implant Sci. 2021;51(6):409-421. doi:10.5051/jpis.2100180009.

    Montevecchi M, Valeriani L. Interleukin-1 Polymorphisms in Caucasian Adults with Down Syndrome and Advanced Periodontitis: A Cross-Sectional Study. Dent J (Basel). 2026;14(5):246. doi:10.3390/dj14050246.'
