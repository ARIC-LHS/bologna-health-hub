  title: 'Tommaso Salzillo: expertise for ENVHLTH-02'
  contribution: 'The DIMEC-CHIMIND Joint lab benefits of the expertise of the “Occupational and Environmental Toxicology” research group and the “Molecular Spectroscopy” one from the departments of Medical and Surgical Sciences (DIMEC) and of Industrial Chemistry “Toso Montanari” (CHIMIND), respectively, of the University of Bologna.

    The Occupational and Environmental Toxicology group has more than 30 years of experience in studying environmental or occupational causes of diseases. The research group has recently participated in the extended partnership RETURN (multi-Risk sciEnce for resilienT commUnities undeR a changiNg climate) project, aiming to assess the effects of climate change on workers and general population (https://www.mattioli1885journals.com/index.php/lamedicinadellavoro/onlinefirst/view/18722).

    Aiming at the screening and evaluation of a plethora of contaminants, molecules, and exogenous substances, the laboratories are equipped with state-of-the-art technologies for Microscopy as well as Spectrometry analysis. The former focus is mainly related to the characterization and quantitative analysis of exogenous micro- and nanoparticles of organic and inorganic nature, including microplastic (MP) particles, in biological matrices as human tissues, using:

    - a correlative microscopy platform with a Variable Pressure Scanning Electron Microscope with Field Emission Gun (VP-FEG-SEM) coupled with Energy Dispersive X-Ray Spectroscopy (EDS);

    - a Fourier transform infrared microscope (FT-IR);

    - a light microscope;

    - an Atomic Force Microscope (AFM) for in-vitro, (down to the single-) cell investigations which could be used for the analysis of contaminants embedded in biological matrices (i.e. mapping Microplastics distribution within cell tissue) and/or their interactions in in vitro studies;

    - a Transmission Electron Microscope (TEM) for the detection of particles up to the nanometer range and localization in the different compartments of the biological tissues, to gain insights on the actual intracellular uptake.

    As a laboratory specifically oriented to the investigation of complex matrices as human tissues, the group is also focused on establishing standardized methods for sample collection and preparation, which take into consideration the possible contamination both in the surgical environment and in the laboratory.

    Regarding the mass Spectrometry, laboratories are equipped with ICP-MS, GC-MS and LC-MS, specializing in the accurate characterization of soluble pollutants in human matrices. The lab has extensive expertise in sample extraction and preparation, employing advanced purification and concentration techniques to optimize analyte recovery and detection. It focuses on the quantification of inorganic contaminants, such as trace metals, using ICP-MS, and organic pollutants, including volatile, semi-volatile, and persistent compounds, through GC-MS and LC-MS. These methodologies support research in biomedical, environmental, and occupational health, enabling precise assessment of exposure to harmful substances (Comito R, Porru E, Violante FS. Analytical methods employed in the identification and quantification of per- and polyfluoroalkyl substances in human matrices - A scoping review. Chemosphere. 2023 Dec;345:140433. doi: 10.1016/j.chemosphere.2023.140433. Epub 2023 Oct 11. PMID: 37832886).

    The research group has also extensive experience in conducting longitudinal epidemiological studies on a number of diseases, including neurological disease (Violante FS, Farioli A, Graziosi F, Marinelli F, Curti S, Armstrong TJ, Mattioli S, Bonfiglioli R. Carpal tunnel syndrome and manual work: the OCTOPUS cohort, results of a ten-year longitudinal study. Scand J Work Environ Health. 2016 Jul 1;42(4):280-90. doi: 10.5271/sjweh.3566. Epub 2016 May 6. PMID: 27159901).

    The Molecular Spectroscopy Group specializes in spectroscopic characterizations at the micro- and nanoscale in both vibrational (Fourier transform infrared and Raman scattering) and electronic (reflectance absorption and photoluminescence) ranges.

    Vibrational spectroscopy is a technique widely used to identify functional groups of organic materials, and it has recently gained popularity in microplastic pollution research. By comparing the spectrum of unknown organic materials with reference spectra (i.e. known polymers), the technique enables their chemical identification with high reliability. We present an example of our research, in which µFTIR was employed for mapping microplastics in wastewater (Figure 1), identifying the different polymers according to their vibrational fingerprints.

    Alongside with µFTIR, the Molecular Spectroscopy Group has expertise in micro-Raman spectroscopy (µRaman). With a spatial resolution reaching 350 nm, µRaman imaging offers significantly higher resolution than the µFTIR approach. This tenfold improvement enables direct nanometric mapping of contaminants in tissues.

    Our experimental strategy will couple µRaman with VIS-NIR (Visible-Near Infrared) microscopy and hyperspectral imaging (Figure 2). Thanks to a highly flexible and tuneable setup, we aim to probe vibrational overtones in specular reflectance configuration via VIS-NIR hyperspectral imaging while simultaneously performing µRaman spectroscopy at the same point.

    The Semiconductor Physics Group of the Department of Physics and Astronomy (DIFA) promotes basic and applied research activities on nanostructured organic materials and electronic devices for bioelectronics. DIFA presents highly equipped photolithography (laser writing, parylene coater, plasma cleaner) and fabrication facilities (spin coater, blade coater, thin film evaporators, laser cutter/etcher, 3D printer and bioprinter) for nano and micro-biosensor patterning and development. Within the last 10 years they achieved high resolution (temporal and spatial), in-vitro cell monitoring for exogenous contaminants (Decataldo, F., Barbalinardo, M., Gentili, D., Tessarolo, M., Calienni, M., Cavallini, M., & Fraboni, B. (2020). Organic Electrochemical Transistors for Real-Time Monitoring of In Vitro Silver Nanoparticle Toxicity. Advanced Biosystems, 4(1), 1900204. https://doi.org/10.1002/ADBI.201900204) or viral cytopathic effects evaluation (Decataldo, F., Grumiro, L., Marino, M. M., Faccin,
    F., Giovannini, C., Brandolini, M., Dirani, G., Taddei, F., Lelli, D., Tessarolo, M., Calienni, M., Cacciotto, C., Lavazza, A., Fraboni, B., Scagliarini, A., & Sambri, V. (2022). Fast and real-time electrical transistor assay for quantifying SARS-CoV-2 neutralizing antibodies. Communications Materials 2022 3:1, 3(1), 5-. https://doi.org/10.1038/s43246-022-00226-6). An example is provided by the automated Tech-Oect platform based on innovative polymers for real-time, high-throughput cell health assessment.

    DIFA recently won a grant from the “Centro Alma Mater Institute on Healthy Planet (AHP)” for a PhD position entitled “Tracking and Toxicological Assessment of Microplastics in Human Tissues: An Exposome-Oriented Transdisciplinary Approach” in collaboration with the other two Departments and the Department of Chemistry “Giacomo Ciamician”.'
