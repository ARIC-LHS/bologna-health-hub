- id: sara-borgomaneri--disease-14
  researcher_id: sara-borgomaneri
  topic_id: horizon-hlth-2027-02-disease-14-two-stage
  title: 'Sara Borgomaneri: expertise for DISEASE-14'
  contribution: 'Expertise in Non-Invasive Brain Stimulation and Translational Neuroscience

    My research focuses on the neural mechanisms underlying emotion processing, memory consolidation, and motor control, with particular emphasis on the interplay between emotion and action. I combine behavioural and neuroscientific methods, including non-invasive brain stimulation (NIBS), transcranial magnetic stimulation (TMS), electromyography (EMG), and electroencephalography (EEG), to investigate how emotional stimuli modulate motor responses and how targeted memory interventions can modify fear-related memories and alleviate maladaptive emotional responses.

    A major strength of my research profile is the extensive expertise I have developed in the application and optimization of non-invasive brain stimulation protocols. Of the 53 publications authored by the PI, 40 focus on NIBS, with the PI serving as first or last author in 25 of these contributions. This research activity has led to publications in high-impact scientific journals, including Nature Communications and Current Biology, demonstrating a strong track record in experimental neuroscience and the development of innovative brain stimulation approaches.

    A key example of this expertise is our work published in Nature Communications, in which we demonstrated that a TMS protocol designed to harness Hebbian plasticity can enhance emotion recognition in young adults. These findings provide a promising foundation for investigating whether targeted modulation of neural plasticity can support the preservation or restoration of cognitive and socio-emotional functions across the lifespan. The same approach is currently being investigated in a healthy older population, representing an important step towards understanding its applicability in ageing and its potential for future clinical translation.

    Building on this background, my research aims to extend established and emerging TMS protocols to neurodegenerative diseases. The overarching goal is to investigate whether targeted modulation of neural plasticity can contribute to preserving or improving functions affected by neurodegeneration, including emotion recognition, memory, and motor control. This approach offers opportunities to develop innovative, non-invasive interventions grounded in mechanistic evidence and to establish the scientific basis for future clinical studies. Within collaborative clinical research frameworks, my expertise could contribute to protocol development and optimization, the identification of relevant neurophysiological and behavioural outcome measures, and the investigation of individual responses to neuromodulation.

    My commitment to translational neuroscience is also reflected in my teaching activities. I teach Neuroscience of Ageing within the Master''s degree programme in Neuroscience and Neuropsychological Rehabilitation, where a substantial part of the course addresses the potential applications of TMS in neurodegenerative disorders. This activity reflects my engagement with the clinical and rehabilitative implications of brain stimulation and supports the integration of fundamental neuroscience, clinical perspectives, and innovative intervention strategies.

    Overall, my expertise combines a strong publication record in non-invasive brain stimulation, methodological proficiency in TMS and electrophysiological techniques, and a research programme focused on neural plasticity and cognitive-affective function. These competencies provide a solid foundation for contributing to collaborative European initiatives aimed at advancing innovative neuromodulation approaches and supporting their translation towards clinical trials in neurodegenerative diseases.'
