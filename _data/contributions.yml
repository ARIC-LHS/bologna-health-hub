- id: carmela-fimognari--envhlth-02
  researcher_id: carmela-fimognari
  topic_id: horizon-hlth-2027-01-envhlth-02
  title: 'Carmela Fimognari: expertise for ENVHLTH-02'
  contribution: 'Multi-methodology approach to assess the impact of the interplay between climate change and the exposome on human health

    An integrated approach is proposed to investigate the exposome effects on molecular biomarkers relevant to chronic diseases, including cancer and cardiovascular disease. The evaluation of key biomarkers (i.e. Nrf2 expression, functional redox indicators; histone deacetylases, and circulating miRNA) in biological fluids collected from populations living in different environmental, social, and occupational contexts may help to explore the “climate change-exposome-phenotypic plasticity” paradigm in humans and to assess the health risks in the studied populations.

    The application of a multi-omics framework (metabolomics, transcriptomics, proteomics) across both in vitro and in vivo models can: 1) characterize biological responses to environmental stressors through advanced metabolic and cellular profiling; 2) identity chemicals or natural products that can mitigate health risks link to climate change.

    The SSH/ethic activities will aim to 1)address the management of sensitive data, FAIR data, RWD, AI, vulnerability, inequalities, and the ethical-conceptual implications of the climate-related exposome; 2)provide strategic support for communication, dissemination, and stakeholder engagement, translating the complex findings on the climate-environment-health nexus into accessible and relevant messages for policymakers and citizens.

    <strong class="contribution-section-title">Publications</strong>

    Marketou M, Caples N, Abela M, Dendale P, Gökdemir Ö, Korzh O, Kurpas D, Lin MN, Mattioli AV, Moholdt T, Muenzel T, Palermi S, Papakonstantinou PE, Piepoli M, Richter D, Shantsila E, Sciomer S, Vaartjes I, Vecchiato M, Venturini E, Abreu A, Biffi A. Climate change and cardiovascular risk factors management: emerging challenges and strategies for prevention and adaptation. Eur J Prev Cardiol. 2026;33(10):1770-1782. doi:10.1093/eurjpc/zwag229

    Cocchi C, Selleri V, Zanini G, Moscucci F, Sciomer S, Gallina S, Nasi M, Desideri G, Pinti M, Borghi C, Mattioli AV. Environmental and social determinants of cardiovascular risk in women with type 2 diabetes: a life-course perspective. Front Endocrinol (Lausanne). 2025;16:1667222. Published 2025 Oct 8. doi:10.3389/fendo.2025.1667222

    Farinetti A, Cocchi C, Coppi F, Mattioli AV. The Exposome, Social Determinants, and Environmental Pollution: Comprehensive Cardiovascular Risk in Women. Am J Lifestyle Med. 2025;20(5):752-759. Published 2025 Jan 8. doi:10.1177/15598276241313329

    Bucciarelli V, Moscucci F, Cocchi C, Nodari S, Sciomer S, Gallina S, Mattioli AV. Climate change versus Mediterranean diet: A hazardous struggle for the women''s heart. Am Heart J Plus. 2024;45:100431. Published 2024 Jul 29. doi:10.1016/j.ahjo.2024.100431

