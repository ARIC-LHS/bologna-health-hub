- id: roberto-mandrioli--disease-10
  researcher_id: roberto-mandrioli
  topic_id: horizon-hlth-2027-01-disease-10
  title: 'Roberto Mandrioli: expertise for DISEASE-10'
  contribution: 'The Advanced Pharmaceutical Analysis group (APA Lab, University of Bologna) offers quantitative bioanalysis and microsampling expertise to support implementation research on evidence-based interventions for chronic non-communicable diseases in children and young people aged 1–24. Its contribution is particularly relevant to long-term treatment monitoring and continuity of care in adolescents and young adults, including those with mental health conditions, in low- and middle-income countries and underserved populations in high-income countries.

    The group develops, validates and applies chromatographic and mass spectrometric methods for drugs, metabolites and endogenous compounds in biological fluids. Published applications include therapeutic drug monitoring using volumetric absorptive microsampling (VAMS), dried blood microsamples and oral fluid, with comparison against conventional sampling methods in psychiatric patients.

    Within a multidisciplinary consortium, APA Lab can undertake the following activities:

    Quantitative monitoring: define and implement longitudinal measurements of drugs, metabolites and, where relevant, established exposure or response markers, selecting analytical targets, biological matrices and sampling schedules with clinical and implementation-science partners.

    Sampling adapted to local settings: apply established low-volume sampling workflows to facilitate repeated measurements in community settings or through supported home collection, where appropriate. Sampling instructions and procedures can be adapted with young people, caregivers and local healthcare professionals.

    Sample integrity and analytical reliability: assess recovery, haematocrit effects, comparability with reference matrices and analyte stability under relevant temperature, humidity, storage and transport conditions. These activities will establish reliable operating conditions for the infrastructure available at participating sites.

    Method transfer and capacity building: provide shared standard operating procedures, calibration and quality-control protocols, interlaboratory comparisons and practical training for staff and early-career researchers in partner institutions.

    Contribution to implementation evaluation: generate objective treatment-exposure data and support adherence assessment through interpretation alongside dosing histories, sampling times and complementary adherence measures. Sample adequacy, collection success and analytical turnaround can also inform joint evaluations of feasibility, acceptability, cost and equitable access.

    These activities would support the evaluation and scaling of established interventions within the consortium’s implementation framework, providing reproducible measurements to complement clinical, public-health and patient-reported outcomes.

    <strong class="contribution-section-title">Selected publications</strong>

    Millán-Santiago J. et al. Volumetric absorptive microsampling for the therapeutic drug monitoring of psychiatric patients treated with cariprazine. Journal of Pharmaceutical and Biomedical Analysis, 236, 115740 (2023). DOI: 10.1016/j.jpba.2023.115740.

    Marasca C. et al. Dried volumetric microsampling approaches for the therapeutic drug monitoring of psychiatric patients undergoing clozapine treatment. Frontiers in Psychiatry, 13, 794609 (2022). DOI: 10.3389/fpsyt.2022.794609.

    Marasca C. et al. Whole blood and oral fluid microsampling for the monitoring of patients under treatment with antidepressant drugs. Journal of Pharmaceutical and Biomedical Analysis, 188, 113384 (2020). DOI: 10.1016/j.jpba.2020.113384.

    Relevant project sand intellectual property

    Participation in the WADA-funded project “Advancing peptide analysis in dried blood spots: application potential and stability study of doping-relevant peptides” (2020 Research Grants; reference 20A12LM), providing methodological background in dried microsample analysis, stability and transport.

    Mercolini L., Protti M., Mandrioli R. “Dispositivo per il micro-campionamento, la conservazione ed il trasporto di una matrice biologica” — Device for microsampling, storage and transport of a biological matrix; Italian patent record no. 102025000025819 (2025).'
