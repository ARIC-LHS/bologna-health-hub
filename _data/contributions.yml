- id: cristiana-caliceti--disease-10
  researcher_id: cristiana-caliceti
  topic_id: horizon-hlth-2027-01-disease-10
  title: 'Cristiana Caliceti: expertise for DISEASE-10'
  contribution: 'Cristiana Caliceti holds a PhD in Biochemistry. Antonello Lorenzini holds a PhD in Biochemistry and Physiopathology of Aging.

    Our group focuses on, nutrition, biosensors and AI tools for data synthesis.

    Antonello Lorenzini has an active collaboration with Prof. Lars Fadnes'' group at the University of Bergen to expand the scope of their "Food for Healthy Life" calculator (F4HL: http://v2.food4healthylife.org/). This calculator currently allows, after analyzing an individual''s diet, to prioritize the changes

    needed to make the diet healthier and therefore capable of extending the individual''s longevity. The calculator will be expanded to estimate the risk of NCDs, using already produced umbrella reviews (1, 2, 3), and others that are in progress. This calculator is currently designed for adults (aged 20 and up) but it could be proposed and adaptation to serve also children.

    A second expertise, which can serve to enrich the proposal from a technological standpoint, is a project on Artificial intelligence born in Bologna between the PI''s group and the CINECA supercomputing consortium. This collaboration aims to develop a tool that uses Natural Language Processing (NLP) to semi-automate the construction of meta-analyses from scientific literature, with particular emphasis on optimizing text and data mining in the biomedical and specifically in the epidemiological field. We have a landing page describing the status of the project and a first manuscript on the tool evaluation is under revision (4).

    Cristiana Caliceti has experience with luminescent sensing technology and potential point-of-care applications. Some of the biosensors under development focus on microbiome health and dietary polyphenol content (5).

    <strong class="contribution-section-title">Relevant publications</strong>

    Umbrella Review of Systematic Reviews and Meta-Analyses on Consumption of Different Food Groups and Risk of Type 2 Diabetes Mellitus and Metabolic Syndrome. Banjarnahor RL, et al. J Nutr. 2025 May;155(5):1285-1297. doi: 10.1016/j.tjnut.2025.03.021. Epub 2025 Mar 22. PMID: 40122387

    Umbrella Review of Systematic Reviews and Meta-Analyses on the Consumption of Different Food Groups and the Risk of Overweight and Obesity. Kristoffersen E, et al., Nutrients. 2025 Feb 13;17(4):662. doi: 10.3390/nu17040662.PMID: 40004990

    Umbrella Review of Systematic Reviews and Meta-analyses on Consumption of Different Food Groups and Risk of All-cause Mortality. Onni AT, et al. Adv Nutr. 2025 Apr;16(4):100393. doi: 10.1016/j.advnut.2025.100393. Epub 2025 Feb 15.PMID: 39956388

    TextAlchemy: an NLP tool to accelerate and semi-automate data extraction, validated in the nutritional field. Rooshan Saleem Butt, et al.; submitted. Preprint: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5807878

    Lighting Up Gut Dysbiosis: Red-Shifted Whole-Cell Bioluminescence Enables Functional Sensing of Bile Salt Hydrolase Activity in Human Feces. Punzo A, et a., ACS Sens. 2026 Aug 31. doi: 10.1021/acssensors.6c02592. Online ahead of print.PMID: 42687409'
