- id: antonello-lorenzini--envhlth-02
  researcher_id: antonello-lorenzini
  topic_id: horizon-hlth-2027-01-envhlth-02
  title: 'Antonello Lorenzini: expertise for ENVHLTH-02'
  contribution: 'Antonello Lorenzini holds a PhD in Biochemistry and Physiopathology of Aging.

    Our group focuses on nutrition and healthy lifestyles. Regarding this Horizon call, we emphasized the need to consider nutrition (part of the exposome) as one of the fundamental determinants of a person''s health status.

    We have an active collaboration with Prof. Lars Fadnes'' group at the University of Bergen to expand the scope of their "Food for Healthy Life" calculator (F4HL: http://v2.food4healthylife.org/). This calculator currently allows, after analyzing an individual''s diet, to prioritize the changes

    needed to make the diet healthier and therefore capable of extending the individual''s longevity. Towards the goal of expanding the calculator''s capabilities so that it will also produce risk estimates of NCDs, the collaboration has already produced three umbrella reviews (1, 2, 3), and it has others in progress. This calculator could serve as a benchmark against which to compare the tool the project proposal aims to develop—a sort of internal check useful for evaluating the effectiveness of the proposed new exposure biomarkers.

    A second expertise, which can serve to enrich the proposal from a technological standpoint, is a project on Artificial intelligence born in Bologna between the PI''s group and the CINECA supercomputing consortium. This collaboration aims to develop a tool that uses Natural Language Processing (NLP) to semi-automate the construction of meta-analyses from scientific literature, with particular emphasis on optimizing text and data mining in the biomedical and specifically in the epidemiological field. We have a landing page describing the status of the project and a first manuscript on the tool evaluation is under revision (4).

    <strong class="contribution-section-title">Relevant publications</strong>

    Umbrella Review of Systematic Reviews and Meta-Analyses on Consumption of Different Food Groups and Risk of Type 2 Diabetes Mellitus and Metabolic Syndrome. Banjarnahor RL, Javadi Arjmand E, Onni AT, Thomassen LM, Perillo M, Balakrishna R, Sletten ISK, Lorenzini A, Plastina P, Fadnes LT.J Nutr. 2025 May;155(5):1285-1297. doi: 10.1016/j.tjnut.2025.03.021. Epub 2025 Mar 22.PMID: 40122387

    Umbrella Review of Systematic Reviews and Meta-Analyses on the Consumption of Different Food Groups and the Risk of Overweight and Obesity. Kristoffersen E, Hjort SL, Thomassen LM, Arjmand EJ, Perillo M, Balakrishna R, Onni AT, Sletten ISK, Lorenzini A, Fadnes LT. Nutrients. 2025 Feb 13;17(4):662. doi: 10.3390/nu17040662.PMID: 40004990

    Umbrella Review of Systematic Reviews and Meta-analyses on Consumption of Different Food Groups and Risk of All-cause Mortality. Onni AT, Balakrishna R, Perillo M, Amato M, Javadi Arjmand E, Thomassen LM, Lorenzini A, Fadnes LT.Adv Nutr. 2025 Apr;16(4):100393. doi: 10.1016/j.advnut.2025.100393. Epub 2025 Feb 15.PMID: 39956388

    TextAlchemy: an NLP tool to accelerate and semi-automate data extraction, validated in the nutritional field. Rooshan Saleem Butt, Matteo Perillo, Michele Visciarelli, Giorgio Pedrazzi, Marco Amato, Andrea Galassi, Rajiv Balakrishna, Anindita Tasnim Onni, Lars Thore Fadnes, Paolo Torroni, Roberta Turra, Antonello Lorenzini; submitted.'
