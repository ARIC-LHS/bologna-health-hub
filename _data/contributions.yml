    • Platelet-Rich Plasma (PRP) Innovation: Leading research in the extraction and characterization of Platelet-Rich Plasma derived from umbilical cord blood (UCB-PRP), with a specific focus on comparing its innate antimicrobial properties against adult peripheral blood PRP.

    Experimental Activities and Methodology:

    • Molecular & Protein Biology: Quantitative gene and protein expression profiling utilizing Real-Time PCR (qPCR), ELISA assays, and Western Blotting.

    • Blood Component Processing: Advanced protocols for the isolation and extraction of therapeutic-grade Platelet-Rich Plasma from umbilical cord blood.

    • Microbiology & Viability Assays: Development of in vitro microbial contamination models, high-throughput detection of microbial growth via automated fluorimetric methods, and metabolic cell viability monitoring using Alamar Blue assays.

    • Oxidative stress markers analysis

    Track Records:

    Peer-Reviewed Publications: AN IN VITRO MODEL OF MICROBIOLOGICAL CONTAMINATION TO EVALUATE THE DISINFECTION OF CARDIOVASCULAR TISSUES INTENDED FOR TRANSPLANTATION (Under Revision)

    • Co-author / Researcher | Journal Article, doi: 10.1155/2019/7623023.

    • Co-author / Researcher | Journal Article, doi: 10.1177/1535370219890873.

    Conference Proceedings & Abstracts:

    • Abstract & Oral/Poster Presentation : An in vitro model of microbiological contamination to evaluate the disinfection of cardiovascular tissues intended for transplantation. 31st Annual Congress of the European Association of Tissue Injury and Cell Banking (EATCB), Zagreb, Croatia (November 22–24, 2023).

    Grant and Projects: Key Researcher: Development of standard and innovative methods for disinfecting human cardiovascular tissues intended for transplant

