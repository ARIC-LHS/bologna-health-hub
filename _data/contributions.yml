- id: maddalena-giannella--disease-08
  researcher_id: maddalena-giannella
  topic_id: horizon-hlth-2027-01-disease-08
  title: 'Maddalena Giannella: expertise for DISEASE-08'
  contribution: 'The clinical research group in Infectious Diseases focuses on antimicrobial resistance (AMR), severe infections caused by multidrug-resistant Gram-negative bacteria, bloodstream infections and infections in immunocompromised patients, including solid-organ transplant recipients. Its expertise includes clinical risk stratification, predictive modelling, integration of clinical, microbiological and pharmacokinetic/ pharmacodynamic (PK/PD) data and prospective multicentre clinical research. The group has experience in designing, coordinating and conducting prospective multicentre studies, including protocol development, definition of clinical endpoints, patient recruitment and follow-up, standardised data collection, and outcome analysis. Its multidisciplinary approach fosters collaboration among infectious disease specialists, microbiologists, pharmacologists, transplant teams, epidemiologists and biostatisticians.

    Potential European Partners and Networks

    Potential contacts for collaborative activities include the partners of EU-funded Horizon 2020 ORCHESTRA project, JPIAMR funded CAVIFOS project and the Hospital General Universitario Gregorio Marañón and Universidad Complutense de Madrid (Spain).

    <strong class="contribution-section-title">Relevant Publications</strong>

    Rinaldi et al., Clinical Microbiology and Infection DOI: 10.1016/j.cmi.2025.11.009

    Bonazzetti et al., Curr Opin Infect Dis. 2026 DOI: 10.1097/QCO.0000000000001205

    Bonazzetti et al., NPJ Digit Med 2025 DOI: 10.1038/s41746-025-01696-x

    Bini Viotti et al., Transpl Infect Dis. 2025 DOI: 10.1111/tid.70154

    <strong class="contribution-section-title">National and European Research Projects</strong>

    JPIAMR initiative “Disrupting Drug Resistance Using Innovative Design” call CAVIFOS project – Optimization and Implementation of Ceftazidime or Ceftazidime-Avibactam Combined with Fosfomycin against Highly Resistant Gram-Negative Bacteria (2023-ongoing)

    PNRR – PE13 INF-ACT – One Health Basic and Translational Research Actions addressing Unmet Needs on Emerging Infectious Diseases, Spoke 3, WP5 – Antimicrobial Resistance (2022-2026). The project addressed emerging infectious diseases and AMR through multidisciplinary research activities.

    EU-funded Horizon 2020 ORCHESTRA project – Connecting European Cohorts to Increase Common and Effective Response to SARS-CoV-2 Pandemic (2020-2024)'
