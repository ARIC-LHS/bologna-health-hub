- id: giorgia-comai--care-02
  researcher_id: giorgia-comai
  topic_id: horizon-hlth-2027-01-care-02
  title: 'Giorgia Comai: expertise for CARE-02'
  contribution: 'Clinical Expertise and Research Contribution: Our research group brings extensive clinical expertise in chronic kidney disease (CKD), nephrology and kidney transplantation, with a particular focus on patients with multimorbidity, polypharmacy and very high clinical and social complexity. We are interested in collaborative research developing personalised approaches to prevent adverse drug reactions (ADRs) and improve medication safety in vulnerable populations. Patients with CKD and kidney transplant recipients are particularly challenging in terms of medication management due to altered drug pharmacokinetics, renal function-dependent dosing, multiple comorbidities and complex therapeutic regimens. Our clinical practice covers the full spectrum of CKD, from advanced kidney disease and dialysis to kidney transplantation, including the management of complex immunosuppressive combinations and innovative therapies. Our distinctive strength is the management of highly complex
    patients requiring innovative and individualised polypharmacotherapy, with continuous assessment of treatment efficacy, tolerability, drug–drug interactions and patient-specific risk factors. This provides a relevant real-world clinical setting for identifying determinants of ADRs and evaluating personalised strategies to reduce preventable medication-related harm. Relevant expertise and contribution: i) High-risk patient characterisation: clinical phenotyping of patients with CKD, multimorbidity, polypharmacy and complex therapeutic needs. Ii)ADR risk assessment: evaluation of drug–drug interactions, renal dosing requirements, treatment burden and clinical determinants of medication-related complications. Iii) Personalised medication optimisation: contribution to individualised prescribing, treatment review and monitoring strategies tailored to kidney function, comorbidities and patient-specific vulnerabilities. Iv) Complex pharmacotherapy: expertise in immunosuppressive regimens, innovative
    immunomodulatory treatments and concomitant medications in kidney transplantation. V) Clinical and translational research: support for observational studies, prospective cohorts and clinical trials, including clinical data collection, longitudinal monitoring and evaluation of medication-safety interventions. VI) Implementation in clinical practice: contribution to multidisciplinary care pathways and personalised decision-support strategies to improve prescribing appropriateness and reduce preventable ADRs. Potential role in the consortium Within HORIZON-HLTH-2027-01-CARE-02, our group would contribute specialised clinical expertise and real-world experience in CKD and transplantation. We would support the identification of high-risk patients, characterisation of ADR determinants, evaluation of personalised medication-management strategies and validation of interventions in populations with substantial therapeutic burden and clinical vulnerability. Our translational research background,
    combining clinical nephrology, experimental kidney research and transplant immunology, provides a strong basis for bridging research innovation and clinical implementation, with potential applicability to broader populations affected by multimorbidity and polypharmacy. Relevance to the Horizon Europe Topic Together, these clinical trials and research projects demonstrate expertise in the management of patients with chronic kidney disease and kidney transplantation, including individuals with substantial comorbidity, complex therapeutic regimens and high clinical vulnerability.The group''s experience encompasses innovative immunomodulatory treatments, immunosuppressive combinations, biomarker-based risk assessment, longitudinal clinical monitoring and the evaluation of treatment-related outcomes. This expertise could support the consortium in characterising high-risk populations, identifying clinical determinants of adverse drug reactions, evaluating personalised medication-management
    strategies and validating interventions in real-world clinical settings

