- id: rita-stagni--disease-10
  researcher_id: rita-stagni
  topic_id: horizon-hlth-2027-01-disease-10
  title: 'Rita Stagni: expertise for DISEASE-10'
  contribution: '<strong class="contribution-section-title">Expertise</strong>

    We have developed an unobtrusive technological approach for the quantitative assessment and longitudinal monitoring of biomarkers of neuro-motor-development in children from birth to adulthood. The proposed approach is designed to support and integrate the traditional assessment of milestones of motor development (i.e. general movements, sitting, horizontal displacement, standing, walking, handling), to quantify developmental trajectories, to identify early signs of neurodevelopmental disorders, to assess the impact of intrinsic and extrinsic factors, as well as of educational and/or therapeutic interventions.

    The approach (TRL 6-7) is easy to implement, child friendly, and little time-consuming, to guarantee applicability and acceptance, as well as reliability of the extracted biomarkers. Data are acquired by clinicians or carers in daily living conditions using inexpensive commercial devices (video for newborns, wearable inertial sensors from infancy to adulthood) at programmed time-points. Quantitative metrics are extracted as biomarkers of functional and control performance, providing a characterization of neuro-motor development that can integrate clinical assessment and/or environmental and/or socio/economic data.

    The longitudinal implementation of the full approach allows to track the developmental trajectory from birth to adult age, but modular implementation of the full protocol is possible to target a specific population and/or research question.

    The proposed assessment in currently applied to children:

    born preterm from birth to 36;

    affected by severe neurologic/rare disorders from 5 to 18 years (i.e. Mowat-Wilson, Dravet, Arnold-Chiari syndrome);

    affected by minor musculoskeletal deformities from 5 to 16 from 5 to 18 years (i.e. scoliosis, flat foot, club foot);

    during pre-school and school age from 4 to 18 years.

    <strong class="contribution-section-title">What we can provide</strong>

    - Design protocols for data acquisition and biomarkers assessment for longitudinal neuro-developmental monitoring based on minimal measurement approach in different ambulatory and ecological conditions: neonatal unit, ambulatory, kindergarten, school, home. The tests, require minimal instrumentation and have been developed to be delivered by physicians, teachers, carers, parents, depending on the specific need.

    - Extract biomarkers of motor development; characterize target population with respect to available developmental trajectory of reference populations (from birth to adulthood).

    - Provide infrastructure for child development digital twin for the interoperability of motor, clinical, and environmental information.

    <strong class="contribution-section-title">Relevant publications</strong>

    Montagna S., Stagni R., …, Bisi M. C. (2020). Digital Twins for Monitoring Neuromotor Development in Preterm Infants: Conceptual Framework and Proof-of-concept Study. JOURNAL OF MEDICAL SYSTEMS

    Bisi M. C., Stagni R. (2025). IMU-based linear and nonlinear metrics for the characterization of fine motor development in early childhood. GAIT & POSTURE

    Bisi M. C., …, Stagni R. (2022). Gait performance in toddlers born preterm: A sensor based quantitative characterization. COMPUTER METHODS AND PROGRAMS IN BIOMEDICINE

    Bisi M. C., …, Stagni R. (2022). Quantitative Characterization of Motor Control during Gait in Dravet Syndrome Using Wearable Sensors: A Preliminary Study. SENSORS

    Bisi M. C., Stagni R. (2020). Human motor control: Is a subject-specific quantitative assessment of its multiple characteristics possible? A demonstrative application on children motor development. MEDICAL ENGINEERING & PHYSICS

    Masini A., … Stagni R., Bisi M. C., … (2020). A multiple targeted research protocol for a quasi-experimental trial in primary school children based on an active break intervention: The imola active breaks (i-move) study. INTERNATIONAL JOURNAL OF ENVIRONMENTAL RESEARCH AND PUBLIC HEALTH

    Bisi, M. C., Tamburini, P., Stagni, R. (2019). A ‘Fingerprint’ of locomotor maturation: Motor development descriptors, reference development bands and data-set. GAIT & POSTURE

    Bisi, M. C., Stagni, R. (2018). Changes of human movement complexity during maturation: quantitative assessment using multiscale entropy. COMPUTER METHODS IN BIOMECHANICS AND BIOMEDICAL ENGINEERING

    Bisi, M. C., Tamburini, P., Panebianco, G. P., Stagni, R. (2018). Nonlinear Analysis of Human Movement Dynamics Offers New Insights in the Development of Motor Control during Childhood. JOURNAL OF BIOMECHANICAL ENGINEERING

    Bisi, M. C., Stagni, R. (2016). Complexity of human gait pattern at different ages assessed using multiscale entropy: From development to decline. GAIT & POSTURE, vol. 47, p. 37-42

    Bisi, M. C., Stagni, R. (2016). Development of gait motor control: What happens after a sudden increase in height during adolescence?. BIOMEDICAL ENGINEERING ONLINE

    Bisi, M. C., Stagni, R. (2015). Evaluation of toddler different strategies during the first six-months of independent walking: A longitudinal study. GAIT & POSTURE, vol. 41, p. 574-579

    Bisi, M. C., Riva, F., Stagni, R. (2014). Measures of gait stability: Performance on adults and toddlers at the beginning of independent walking. JOURNAL OF NEUROENGINEERING AND REHABILITATION, vol. 11, p. 1-8

    <strong class="contribution-section-title">Funded Projects</strong>

    I-DASY: Instrument-based holistic DigitAl twinS for monitoring neuro-motor developmental trajectorY in preterm infants. PRIN: PROGETTI DI RICERCA DI RILEVANTE INTERESSE NAZIONALE – Bando 2022, 20222X4M4T- CUP J53C24002660006'
