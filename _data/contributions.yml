- id: olivia-manfrini--disease-01
  researcher_id: olivia-manfrini
  topic_id: horizon-hlth-2027-02-disease-01-two-stage
  title: 'Olivia Manfrini: expertise for DISEASE-01'
  contribution: 'The Laboratory of Epidemiology and Clinical Cardiology at the University of Bologna (head: Prof. Olivia Manfrini, MD, Associate Professor of Cardiology; h-index 37, >100 peer-reviewed articles, IF-2025= 1450.10, IF-medio 13.81) has long-standing documented expertise in clinical and epidemiological research on ischaemic heart disease (IHD) and acute coronary syndromes (ACS), with a specific focus on the evaluation of healthcare interventions and treatment outcomes in real-world and multinational settings, and on sex-, gender- and age-stratified analyses. Prof. Manfrini has served on the steering committee of the international ISACS registry network since 2010. The group offers clinical and epidemiological contributions to a consortium developing and validating innovative healthcare interventions for cardiovascular disease, and on prospective recruitment capacity in collaboration with the IRCCS AOU Bologna.

    Topic-specific activities and tasks the group can carry out within a consortium

    Contribution to clinical studies validating innovative interventions for cardiovascular disease, including multicentre prospective recruitment and long-term follow-up in collaboration with the IRCCS AOU Bologna.

    Real-world-data analysis, long-term monitoring and scalability of innovative interventions, with sex-, gender-, age- and socioeconomic stratification where relevant variables are available.

    Assessment of inequalities and disparities in access to and outcomes of cardiovascular care across Europe, to tailor interventions to underserved populations.

