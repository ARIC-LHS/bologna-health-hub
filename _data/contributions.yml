- id: michele-protti--care-02
  researcher_id: michele-protti
  topic_id: horizon-hlth-2027-01-care-02
  title: 'Michele Protti: expertise for CARE-02'
  contribution: 'Molecular profiling and bioanalysis for safer personalised polypharmacy

    PTA Lab contributes targeted bioanalysis and untargeted HRMS profiling to investigate adverse drug reaction (ADR) risk during polypharmacy. Drug exposure measurements, metabolic profiles and selected exposure markers support patient stratification and personalised medication management.

    <strong class="contribution-section-title">Activities and methodologies</strong>

    Drug exposure and interactions. Validate quantitative assays for selected drugs and metabolites. Interpret exposure with clinical partners alongside dosing, sampling times, concomitant therapies and organ function to investigate drug–drug and drug–food interactions.

    Longitudinal pharmaco-exposomics. Combine targeted measurements with untargeted profiling before and during treatment. Investigate molecular changes associated with ADR susceptibility or onset, considering dietary, smoking and environmental exposures. Adapt microsampling to repeated collection and analyte stability.

    Data quality and integration. Deliver traceable datasets with quality controls and annotation confidence. Assess drift, batch effects and missingness; integrate with pharmacogenomics, PK/PD models, electronic health records and clinical outcomes, accounting for sex, comorbidities and treatment changes with consortium partners.

    Candidate panel validation. Translate candidate signatures into targeted assays and test reproducibility in independent patient groups. With clinical and biostatistical partners, evaluate associations with clinically assessed ADRs and added value for risk stratification, early detection and prescribing or deprescribing decisions.

    Fit within the consortium. The module complements clinical pharmacology and digital decision support. Partners provide cohorts, ADR assessment, medication-management pathways and expertise in health economics, regulation and implementation to evaluate clinical utility.

    <strong class="contribution-section-title">Relevant project experience</strong>

    Therapeutic monitoring of antidepressants (SSR Emilia-Romagna 707/2018/SPER/AUSLBO); lithium monitoring by microsampling (849/2022/SPER/AUSLBO); alcohol intake and abuse in workplaces (Italian Ministry of Health, RF-2011-02352096).

    <strong class="contribution-section-title">Selected publications</strong>

    Protti M et al. New-generation, non-SSRI antidepressants: Drug-drug interactions and therapeutic drug monitoring. Part 2: NaSSAs, NRIs, SNDRIs, MASSAs, NDRIs, and others. Medicinal Research Reviews. 2020;40(5):1794–1832. DOI: 10.1002/med.21671.

    Marasca C et al. Whole blood and oral fluid microsampling for the monitoring of patients under treatment with antidepressant drugs. Journal of Pharmaceutical and Biomedical Analysis. 2020;188:113384. DOI: 10.1016/j.jpba.2020.113384.

    Marasca C et al. Volumetric Absorptive Microsampling of Blood for Untargeted Lipidomics. Molecules. 2021;26(2):262. DOI: 10.3390/molecules26020262.'
