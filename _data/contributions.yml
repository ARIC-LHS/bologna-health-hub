- id: claudia-zanna--envhlth-02
  researcher_id: claudia-zanna
  topic_id: horizon-hlth-2027-01-envhlth-02
  title: 'Claudia Zanna: expertise for ENVHLTH-02'
  contribution: 'MoBiDD Lab (Molecular Biochemistry in Degenerative Diseases), coordinated by Claudia Zanna & Silvia Cetrullo, investigates how environmental and metabolic stressors reshape cellular homeostasis and contribute to chronic and degenerative diseases. The group offers complementary expertise in small non-coding RNAs—including miRNAs, isomiRs and tRNA-derived fragments (tRFs)—RNA-binding proteins, mRNA stability and translation, with a strong focus on post-transcriptional mechanisms of cellular stress adaptation.

    Within HORIZON-HLTH-2027-01-ENVHLTH-02, MoBiDD Lab has the consolidated expertise to characterise non-coding RNA signatures - tRNA-derived fragments in particular- induced by climate-related exposures and their interaction with nutritional, metabolic and chemical stressors. Integrated molecular, biochemical, multi-omics and bioinformatic approaches could identify exposure-responsive regulatory networks and validate RNA fragments as sensitive, minimally invasive biomarkers of exposure, early biological effect, vulnerability and resilience. Their stability and compatibility with scalable analytical workflows may support sustainable and readily implementable monitoring strategies.

    The group also brings expertise in mitochondrial metabolism and dynamics, including fusion/fission, mitophagy, biogenesis, mtDNA maintenance and stress-response pathways. These processes can be integrated with RNA-based regulation to clarify how combined exposures affect energy homeostasis, proteostasis, senescence and cell fate.

    Mechanistic validation can be performed in advanced human-relevant systems, including induced pluripotent stem cell-derived models and 3D organoids. These platforms enable controlled modelling of single and combined exposures and help bridge population-level exposome and omics data with tissue-specific biological responses and health outcomes.

    Keywords: small non-coding RNA, tRNA-derived fragments, mitochondrial dynamics, induced pluripotent stem cells, 3D models

    <strong class="contribution-section-title">Selected publications</strong>

    Cosentino C et al. 5’tRNA-derived fragments modulate β-cell homeostasis and islet macrophage activation in type 2 diabetes. Nature Communications (2026). DOI: 10.1038/s41467-026-72641-z

    Bissoli I et al. Modeling heart failure by induced pluripotent stem cell-derived organoids. BBA – Molecular Basis of Disease (2025). DOI: 10.1016/j.bbadis.2025.167861

    Panichi V et al. Intrinsic amyloid deposition following proteostasis impairment in osteoarthritic chondrocytes: Insights and therapeutic approaches. BBA – Molecular Basis of Disease (2025). DOI: 10.1016/j.bbadis.2025.167865

    Danese A et al. Pathological mitophagy disrupts mitochondrial homeostasis in Leber’s hereditary optic neuropathy. Cell Reports (2022). DOI: 10.1016/j.celrep.2022.111124

    Aleo SJ et al. Drug repositioning as a therapeutic strategy for neurodegenerations associated with OPA1 mutations. Human Molecular Genetics (2021) DOI: 10.1093/hmg/ddaa244'
