  title: 'Luisa Sambati: expertise for DISEASE-14'
  contribution: 'Dr. Sambati could contribute clinical and neuropsychological expertise to early-stage trials in dementia and other neurodegenerative diseases. Her experience includes principal investigator roles in randomised, double-blind, placebo-controlled trials and longitudinal assessment of cognitive, behavioural, motor and non-motor outcomes.

    In particular, she could contribute to the topic with:

    1. Clinical trial delivery: protocol development, participant screening and characterisation, safety and tolerability assessment, and longitudinal follow-up, drawing on experience in phase 2 studies.

    2. Outcome assessment: selection and harmonisation of cognitive, functional, motor and non-motor measures; clinical interpretation of collected data.

    3. Non-pharmacological interventions (cognitive training, brain stimulation)

    4. Assessment of quality of life, patient and caregiver priorities, and acceptability with multidisciplinary partners.

    Relevant clinical trials experience:

    Randomised, double-blind, placebo-controlled study to assess safety and efficacy of PRI-002 in patients with MCI or mild dementia due to Alzheimer’s Disease (AD), Principal Investigator

    A Phase IIb, Randomized, Double-Blind, Placebo-Controlled, Multicenter Study to Evaluate the Efficacy and Safety of Intravenous Prasinezumab in Participants with Early Parkinson''s Disease, Principal Investigator since September 2024

    <strong class="contribution-section-title">Relevant projects experience</strong>

    Effect of CPAP treatment on cognitive function in patients with mild cognitive impairment (MCI) or Alzheimer’s disease (AD) and obstructive sleep apnoea (OSA).

    “Shedding Light on Dementia with Lewy Bodies: a Randomized Controlled Trial using a multimodal ‘Bright Light Treatment’ to modulate brain functional responses through the eyes”

