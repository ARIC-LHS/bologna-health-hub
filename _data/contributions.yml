- id: gian-luca-pirazzoli--stayhlth-01
  researcher_id: gian-luca-pirazzoli
  topic_id: horizon-hlth-2027-01-stayhlth-01
  title: 'Gian Luca Pirazzoli: expertise for STAYHLTH-01'
  contribution: 'Dr. Pirazzoli could contribute geriatric expertise to support clinical management and independent living in adults with disabilities, particularly those with Down syndrome. He heads the clinic for functional and cognitive health in adults with Down syndrome and is the clinical contact for cognitive disorders in patients with complex epilepsies at IRCCS ISN. His background includes geriatric and orthogeriatric care, internal medicine consultancy and home geriatric visits.

    Potential contributions to the topic include:

    1. Clinical, functional, and cognitive assessment and follow-up of adults with Down syndrome, to characterise changing care needs and factors associated with loss of independence.

    2. Geriatric assessment of multimorbidity and cognitive and motor impairment, to inform personalised care pathways supporting autonomy.

    3. Clinical characterisation of participants and interpretation of functional and cognitive outcomes in collaborative studies investigating biomarkers in Down Syndrome.

    Relevant research experience

    Geriatric and orthogeriatric practice in Ferrara (2016–2018) and Bologna (2018–2025); since February 2025, internal medicine and geriatric consultancy at IRCCS ISN.

    Co-authorship of studies on neurological findings, DNA methylation and one-carbon metabolism in Down syndrome. Best Oral Communication Award, SIGOT 2022, for work on premature epigenetic ageing and functional and cognitive deficits in Down syndrome.

    Training in the DAMA model for hospital care of people with disabilities (Istituto Superiore di Sanità, 2022).

    Research project “Ageing in people with trisomy 21” (longitudinal evaluation of molecular markers and clinical, functional, neuropsychological and cognitive features).

    <strong class="contribution-section-title">Selected publications</strong>

    Alterations of gut microbiota in Down syndrome and their association with Alzheimer''s disease. Pellegrini C, … Pirazzoli GL, … Bacalini MG. Alzheimers Dement. 2026 Sep;22(9):e71815. doi: 10.1002/alz.71815.

    Metabolic and genetic imbalance of the homocysteine-methionine cycle in trisomy 21. Vione B et al.,…,Pirazzoli GL,…., Caracausi M. Physiol Genomics. 2025;57(9):566–574. doi: 10.1152/physiolgenomics.00168.2024.

    Neurological findings in a cohort of adults with Down syndrome.

    Grotteschi N et al.,…,Pirazzoli GL, Sambati L. Neurol Sci. 2025;46(8):3639–3649. doi: 10.1007/s10072-025-08195-7.'
