- id: luisa-sambati--stayhlth-01
  researcher_id: luisa-sambati
  topic_id: horizon-hlth-2027-01-stayhlth-01
  title: 'Luisa Sambati: expertise for STAYHLTH-01'
  contribution: 'Dr. Sambati could contribute to the project by providing clinical (neurological) and neuropsychological expertise in supporting autonomy in adults with disability, particularly in later life. She has a specific background in neurological and neuropsychological assessment of patients assessment of with neurodegenerative disorders and adults with Down syndrome. She is PI or partner of projects involving participants with Down syndrome, cognitive decline or motor symptoms.

    In particular, she can contribute to the topic with:

    1. Longitudinal clinical, cognitive and behavioural assessment of participants, in order to characterise functional trajectories and identifying factors associated with loss of independence.

    2. Assessment of motor and non-motor symptoms, including autonomic dysfunction and sleep disturbances, and their relationship with everyday functioning.

    3. Evaluation of patient and caregiver needs.

    <strong class="contribution-section-title">Relevant project experience</strong>

    Ageing in people with trisomy 21: longitudinal evaluation of molecular markers and clinical, functional, neuropsychological and cognitive features (from 2022).

    PROPAG-AGEING (Horizon 2020): research on healthy ageing and Parkinson’s disease; clinical investigation of motor and non-motor predictors in early parkinsonian syndromes.

    <strong class="contribution-section-title">Selected publications</strong>

    Neurological findings in a cohort of adults with down syndrome. Grotteschi N, Rochat MJ, Pollarini V, Ghezzo A, Pellegrini C, Calandra-Buonaura G, Lodi R, Tonon C, Cortelli P, Bacalini MG, Pirazzoli GL, Sambati L. Neurol Sci. 2025 Aug;46(8):3639-3649. doi: 10.1007/s10072-025-08195-7

    Calandra-Buonaura G, Sambati L, et al. The Bologna motor and non-motor prospective study on parkinsonism at onset (BoProPark): study design and population. Neurol Sci. 2020. doi: 10.1007/s10072-020-04305-9.

    Alterations of gut microbiota in Down syndrome and their association with Alzheimer''s disease. Pellegrini C, …, Sambati L, … Bacalini MG. Alzheimers Dement. 2026 Sep;22(9):e71815. doi: 10.1002/alz.71815

    Quality of life and disability in pure autonomic failure: More than a prodromal synucleinopathy. Cani I, Carrozzo G, Baccari F, Schettino M, Zenesini C, Giannini G, Sambati L, Baldelli L, Greco MC, Cortelli P, Guaraldi P, Vignatelli L, Calandra-Buonaura G. Parkinsonism Relat Disord. 2026 Jan;142:108112. doi: 10.1016/j.parkreldis.2025.108112'
