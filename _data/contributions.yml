- id: luca-mulazzani--envhlth-02
  researcher_id: luca-mulazzani
  topic_id: horizon-hlth-2027-01-envhlth-02
  title: 'Luca Mulazzani: expertise for ENVHLTH-02'
  contribution: 'Our agricultural economics group has strong expertise in studying supply chains and price formation of agricultural products.

    This mean that starting from shocks, such as climate change, policy interventions or other drivers affecting the production of food, we are able to estimate how this affects the price of foods across space, time and product processing (i.e. from raw agricultural product to final product for the consumer). We are able to analyze the effect of trade and farms/firms behavior along the supply chain.

    Changes of food availability and price can affect the alimentation of people and then their health status.

    We applied our studies in two Horizon projects: Biovalue, where the topic was the valorization of underutilized crops; and Foodland where we studied the behavior and acceptance of African producers and consumers to change crops and food.

    Top papers:

    Carloni, Elisa, Giordano, Claudia, Di Fiore, Gianluca Nicola, Mulazzani, Luca, Setti, Marco, Falasconi, Luca, Govigli, Valentino Marini (2025). Promoting sustainable food systems: An empirical analysis of local Food Hub governance models and structures in 12 African settings. ENVIRONMENTAL SCIENCE & POLICY, vol. 164, p. 1-15, ISSN: 1462-9011, doi: 10.1016/j.envsci.2024.103983

    Aminravan, Marzieh, Ahmadi Kaliji, Sina, Mulazzani, Luca, Rota, Cosimo, Camanzi, Luca (2025). Surveying consumer preferences for eco-labeled fruits and vegetables in Euro-Mediterranean alternative food systems. FRONTIERS IN SUSTAINABLE FOOD SYSTEMS, vol. 9, p. 1-12, ISSN: 2571-581X, doi: 10.3389/fsufs.2025.1576321

    Verza M., Camanzi L., Mulazzani L., Giampaolo A., Rodriguez S., Malorgio G., Mattas K. (2025). Underutilized crops for diversified agri-food systems: spatial modeling and farmer adoption of buckwheat in Italy. FRONTIERS IN SUSTAINABLE FOOD SYSTEMS, vol. 9, p. 1-13, ISSN: 2571-581X, doi: 10.3389/fsufs.2025.1534246

    Verza, Marta, Camanzi, Luca, Rota, Cosimo, Mulazzani, Luca, Malorgio, Giulio, Mattas, Konstadinos (2025). From farm to shelf: managing agrobiodiversity and product diversity in agri-food supply chains. BRITISH FOOD JOURNAL, vol. 127, p. 322-337, ISSN: 0007-070X, doi: 10.1108/bfj-11-2024-1168'
