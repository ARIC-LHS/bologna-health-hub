- id: laura-mercolini--ind-02
  researcher_id: laura-mercolini
  topic_id: horizon-hlth-2027-02-ind-02-two-stage
  title: 'Laura Mercolini: expertise for IND-02'
  contribution: 'Microsampling and reference bioanalysis for point-of-care diagnostics

    PTA Lab offers a specialist bioanalytical contribution to consortia developing portable point-of-care (PoC) diagnostics. Validated laboratory methods, microsampling and miniaturised sample preparation support device optimisation, comparative performance assessment and clinical validation for a defined diagnostic need.

    <strong class="contribution-section-title">Activities and methodologies</strong>

    Laboratory comparator methods. Develop and validate (U)HPLC-MS/MS and HRMS assays for selected clinically relevant analytes and biomarkers. Establish sensitivity, selectivity, precision, accuracy and stability across the concentration ranges needed for the intended use, with appropriate calibration and quality controls.

    Sampling and device compatibility. Adapt small-volume collection and sample preparation to the specimen and device architecture. Assess extraction recovery, matrix effects, haematocrit-related bias and handling conditions where relevant. Select liquid or dried sampling according to device requirements and the laboratory comparator workflow.

    Comparative performance. Analyse paired specimens to assess agreement, systematic bias and reproducibility between PoC devices and validated laboratory methods. Investigate discordant results and analytical interferences with device developers and clinical partners, including performance near relevant decision thresholds.

    Clinical validation and transfer. Provide analytical measurements for clinical studies and harmonised SOPs, acceptance criteria and quality-control procedures across sites. Assess workflow robustness under intended operating conditions and identify opportunities to reduce sample handling, consumables and equipment requirements in resource-limited settings.

    Fit within the consortium. The module complements device developers, microfluidics and biosensor specialists, manufacturers and clinical centres. Regulatory and HTA partners guide conformity assessment and adoption; PTA Lab supplies analytical evidence supporting these activities.

    <strong class="contribution-section-title">Relevant project experience</strong>

    Minimally invasive TDM of antidepressants in eating-disorder patients (SSR Emilia-Romagna 707/2018/SPER/AUSLBO); lithium monitoring by capillary microsampling (849/2022/SPER/AUSLBO); peptide and growth-factor stability in dried microsamples (WADA 17A20LM, 19A08LM, 20A12LM).

    <strong class="contribution-section-title">Selected publications</strong>

    Protti M et al. Assessment of capillary volumetric blood microsampling for the analysis of central nervous system drugs and metabolites. Analyst. 2020;145(17):5744–5753. DOI: 10.1039/D0AN01039A.

    Millán-Santiago J et al. Volumetric absorptive microsampling for the therapeutic drug monitoring of psychiatric patients treated with cariprazine. Journal of Pharmaceutical and Biomedical Analysis. 2023;236:115740. DOI: 10.1016/j.jpba.2023.115740.

    3. Protti M, Mercolini L, Mandrioli R. Review: the role of automation in improving the performance and throughput of microsample bioanalysis. Analytica Chimica Acta. 2025;1359:344018. DOI: 10.1016/j.aca.2025.344018.'
