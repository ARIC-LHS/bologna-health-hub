- id: andrea-bedini--envhlth-02
  researcher_id: andrea-bedini
  topic_id: horizon-hlth-2027-01-envhlth-02
  title: 'Andrea Bedini: expertise for ENVHLTH-02'
  contribution: 'Within the multidisciplinary research network of the Department of Pharmacy and Biotechnology (FaBiT), University of Bologna, the Cellular and Molecular Pharmacology research unit has long been engaged in the study of opioid receptors and integrins, investigating their expression, activation, and signaling pathways in diverse in vitro cellular models, while also focusing on the characterization of innovative ligands as a foundation for the development of novel therapeutic strategies. Over the years, the group has developed extensive expertise in molecular and cellular pharmacology, neuropharmacology, receptor pharmacology, neuroinflammatory signaling, transcriptional regulation, advanced neuronal and glial in vitro models, quantitative systems pharmacology, and pharmacological target characterization. This research activity has enabled the establishment of a solid methodological and conceptual framework for quantifying receptor expression at both mRNA and protein levels,
    assessing multiple intracellular signaling readouts (e.g. western blotting, ELISA, confocal microscopy, flow cytometry, gene reporter analysis), and investigating the downstream functional effects of pharmacological and biological stimuli. Collectively, these competencies have generated a comprehensive know-how in the analysis of complex signaling networks and pharmacological responses, particularly in the contexts of pain, cancer, inflammation, and neuroinflammatory disorders.

    Moreover, the research group has been involved in several collaborations with international research groups performing cutting-edge studies and has cooperated with pharmaceutical companies.

    Therefore, within this frame and in relation to the topic HORIZON-HLTH-2027-01-ENVHLTH-02, the Cellular and Molecular Pharmacology Unit could establish and investigate the biological pathways and mechanisms by which the exposome drives health impacts. The analysis of the biological pathways involved could be performed using in vitro cell models (e.g. human cell lines, human primary cells, 3D cell models, co-culture models) and molecular and pharmacological techniques.

    Moreover, the research group could also identify and quantify exposome-relevant biomarkers in cells and/or biological fluids (e.g. inflammation, epigenetic biomarkers, circulating miRNA) for exposome-related health risks. Exposome-relevant biomarkers to be measured could include gene expression and epigenetic modifications, metabolic pathway analysis, and immune responses.

    The research group participated from 2020 to 2025 in the H2020-funded project QSPain Relief (grant agreement No 848068).

