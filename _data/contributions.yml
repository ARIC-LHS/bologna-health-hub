- id: roberto-mandrioli--disease-01
  researcher_id: roberto-mandrioli
  topic_id: horizon-hlth-2027-02-disease-01-two-stage
  title: 'Roberto Mandrioli: expertise for DISEASE-01'
  contribution: 'The Advanced Pharmaceutical Analysis Research Group (APA Lab, Department of Pharmacy and Biotechnology, University of Bologna), led by Roberto Mandrioli, offers specialist bioanalytical support for early-stage clinical trials of innovative interventions for cardiovascular diseases, diabetes, chronic respiratory diseases or chronic kidney diseases. Its contribution focuses on quantitative measurements supporting pharmacokinetics, pharmacodynamics, dose and schedule selection, treatment adherence and safety, including phase I/II studies of pharmacological interventions.

    The group develops, validates and applies chromatographic and mass spectrometric methods, including HPLC-MS/MS and UHPLC-HRMS, for drugs, active metabolites and endogenous compounds in conventional and miniaturised biological samples. Within a multidisciplinary consortium, APA Lab can undertake the following activities:

    Trial-specific assay development and validation: establish quantitative methods for investigational treatments, relevant concomitant medications, metabolites and selected biomarkers. Experimental activities include sample preparation optimisation, calibration, and validation appropriate to the intended clinical use.

    Bioanalysis supporting PK/PD and exposure–response assessment: analyse longitudinal trial samples collected according to defined dosing and sampling schedules. Concentration data can support dose selection, characterisation of interindividual variability and interpretation of efficacy and safety outcomes alongside clinical and modelling partners. Particular attention can be given to multimorbidity, polypharmacy and altered drug disposition in patients with impaired renal function.

    Chemical assessment of pharmacological and non-pharmacological interventions: quantify endogenous compounds selected with clinical partners according to the intervention mechanism and trial hypotheses. Where relevant, concomitant medication measurements can help distinguish changes in treatment exposure from biological responses to the intervention, complementing clinical endpoints and digital monitoring.

    Sampling strategies suited to repeated monitoring: evaluate dried blood spots, volumetric absorptive microsampling and dried plasma microsamples when they improve sampling frequency or reduce participant burden. Activities include comparison with conventional plasma measurements, assessment of haematocrit and sampling-time effects, and verification of analyte stability during storage and transport. Collection procedures can be adapted with patients and clinical teams for use during follow-up, including supported home sampling where feasible.

    <strong class="contribution-section-title">Selected publications</strong>

    Protti M. et al. How microsampling is impacting pharmacokinetic and toxicokinetic studies: volumetric absorptive microsampling (VAMS). Bioanalysis, 17, 997–1009 (2025). DOI: 10.1080/17576180.2025.2546782.

    Squarzoni A. et al. Exposure of dams to Elexacaftor/Tezacaftor/ Ivacaftor during pregnancy and breastfeeding induces reversible alterations in newborn wild type CD-1 mice. Journal of Cystic Fibrosis, 25, 13–20 (2026). DOI: 10.1016/j.jcf.2025.11.004.

    Millán-Santiago J. et al. Volumetric absorptive microsampling for the therapeutic drug monitoring of psychiatric patients treated with cariprazine. Journal of Pharmaceutical and Biomedical Analysis, 236, 115740 (2023). DOI: 10.1016/j.jpba.2023.115740.

    Relevant project and intellectual property

    Participation in the WADA-funded project “Advancing peptide analysis in dried blood spots: application potential and stability study of doping-relevant peptides” (2020 Research Grants; reference 20A12LM), providing methodological background in quantitative LC–MS/MS analysis and experimental evaluation of microsample stability, storage and transport conditions.

    Mercolini L., Protti M., Mandrioli R. “Dispositivo per il micro-campionamento, la conservazione ed il trasporto di una matrice biologica” — device for microsampling, storage and transport of a biological matrix; Italian patent record no. 102025000025819 (2025).'
