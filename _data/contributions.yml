- id: cecilia-garofalo--disease-14
  researcher_id: cecilia-garofalo
  topic_id: horizon-hlth-2027-02-disease-14-two-stage
  title: 'Cecilia Garofalo: expertise for DISEASE-14'
  contribution: 'The Neuroscience Biobank of Bologna(BNB), in the IRCCS Istituto delle Scienze Neurologiche di Bologna is a strategic resource for translational research on disorders of the nervous system and a key enabling infrastructure for clinical research in neurodegenerative diseases. It collects, processes, stores, and distributes human-derived biological samples and associated clinical data, supporting the advancement of neuroscience research under an ISO 9001-certified quality management system.

    The BNB aims to promote the responsible sharing of biological resources, the recruitment of patient cohorts, and the development of clinical, genomic, and translational studies, thereby supporting both research and the care of people affected by neurological disorders.

    BNB can manage a wide range of biological matrices, including peripheral blood, plasma, serum, cerebrospinal fluid, urine, DNA, RNA, and other derivatives obtained from study participants, ensuring their standardised collection, processing, storage, and traceability.

    In addition to its active role in biobanking samples, the BNB can also serve as a secure, quality-controlled repository for samples generated within research projects, providing dedicated storage, sample management, and long-term preservation according to the requirements of the study protocol.

    The BNB can contribute to clinical trials by providing well-characterised biospecimens and longitudinal clinical data, supporting participant stratification and enrichment through molecular and fluid biomarkers.'
