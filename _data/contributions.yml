- id: isacco-gualandi--ind-02
  researcher_id: isacco-gualandi
  topic_id: horizon-hlth-2027-02-ind-02-two-stage
  title: 'Isacco Gualandi: expertise for IND-02'
  contribution: 'The research group has consolidated expertise in the design, fabrication and analytical validation of innovative electrochemical sensors and biosensors for portable, wearable and point-of-care applications. Its activities cover the complete development chain from functional materials and sensing interfaces to device integration and testing in clinically relevant matrices. Core competences include conducting polymers, particularly PEDOT:PSS, organic electrochemical transistors (OECTs), potentiometric and amperometric transduction, enzyme and nanomaterial functionalisation, flexible and textile substrates, passive sampling, low-power operation, and the possibility of real-time monitoring.

    In relation to the topic, the group can contribute to the optimisation of sensitive, selective, miniaturised, portable, and user-friendly PoC platforms; the development of sample-to-result concepts combining sampling, fluid handling, and electrochemical readout; analytical characterisation and benchmarking against reference methods; evaluation of selectivity, robustness, stability, reproducibility and matrix effects; and integration of sensors into flexible, textile or medical-grade supports suitable for scalable manufacturing. The group can also support the definition of performance requirements, validation protocols and comparative studies needed to demonstrate added value over the state of the art, working with clinical, industrial and regulatory partners towards clinical validation and conformity assessment. These competences are closely aligned with the topic’s emphasis on REASSURED and sample-to-answer diagnostics, comparative performance studies, clinical validation, and subsequent
    MDR/IVDR conformity assessment.

    Relevant achievements include a label-free OECT platform for point-of-care uric-acid determination validated in human saliva; fully textile OECTs for wearable biosensing; OECT biosensors for glucose and lactate based on enzyme-functionalised layered double hydroxides; and smart medical dressings for continuous pH,uric-acid and moisture monitoring in wound exudate. The group has also developed a fully passive and wearable OECT-enabled oxygen sensor, providing expertise relevant to equipment-modest and low-power diagnostic solutions.

    The team’s translational background includes the PON TEX-STYLE project on intelligent and sustainable textiles, industrial collaborations for smart dressings and textile ECG electrodes, and a university Proof-of-Concept action supporting exploitation of an OECT-based chemical-sensor patent. The related invention, “Electrochemical organic transistor based on conducting polymer and nanoparticles of Ag halide, AgX (X = Cl, I, Br) as chemical sensor”, was filed as PCT/IT2018/050069, published as WO 2018/207220 and granted as EP 3622282 B1.'
