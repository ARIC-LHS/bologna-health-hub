- id: marina-tadolini--care-02
  researcher_id: marina-tadolini
  topic_id: horizon-hlth-2027-01-care-02
  title: 'Marina Tadolini: expertise for CARE-02'
  contribution: 'Clinical contribution and target populations

    We offer clinical expertise in complex multidrug treatment and a setting for evaluating personalised approaches to adverse drug reaction (ADR) prevention. Prof. Tadolini’s expertise covers mycobacterial infections as tuberculosis (TB) disease, including drug-resistant (MDR-TB) disease, TB infection, TB/HIV coinfection, non-tuberculous mycobacterial (NTM) disease, with inpatient and outpatient care. Her publications mainly address TB and NTM treatment tolerability, cardiac safety of combined TB and MDR-TB regimens and practical treatment optimisation [1–3].

    Reducing the risk of adverse drug reactions is particularly relevant for TB and NTM affected patients, as the treatment requires a combination of 3-4 antibiotics for prolonged period of time, with careful management of drug interactions and tolerability [1].

    The wider Infectious Diseases Unit can further contribute patients and clinical data across TB, NTM, HIV, viral hepatitis and coinfections. We seek to include these populations within a broader multicentre cohort of people with multimorbidity receiving three or more concomitant drugs. Patients with cardiovascular comorbidities are a priority subgroup for assessing interactions between anti-infective and cardiovascular treatments, cumulative toxicity and treatment burden.

    Clinical resources and biological samples

    Available resources include clinical data and blood samples collected through existing studies. These provide a basis for retrospective analyses and translational collaborations, complemented by prospective recruitment and follow-up. Dataset coverage, sample characteristics and linkage to clinical records would be assessed for each proposed analysis; reuse and additional collection would follow applicable consent, ethics approvals and institutional agreements.

    Proposed activities and methodology

    Cohort characterisation and data harmonisation. Define shared eligibility criteria and a common dataset covering medication exposure, comorbidities, renal and hepatic function, ADRs and outcomes. Reconstruct treatment changes and assess drug–drug interactions, with attention to age, sex and cardiovascular risk. Distinguish suspected interactions from clinically observed ADRs.

    Clinical safety and personalised prescribing. Support prospective ADR assessment, medication reconciliation and multidisciplinary review. Evaluate individualised monitoring and prescribing adjustments that preserve effective anti-infective treatment. Outcomes include QTc changes, cardiac events, hepatic or renal toxicity, treatment interruption, hospitalisation, adherence and patient-reported treatment burden.

    Translational studies with specialist partners. Contribute clinical phenotyping, suitable blood samples and prospective sampling to pharmacogenomic, pharmacokinetic, pharmacodynamic and biomarker studies. Pharmacology and laboratory partners would provide the complementary assays and analytical platforms needed to investigate variability in drug exposure and susceptibility to toxicity.

    Clinical validation and implementation. Co-design and clinically validate ADR risk models, including AI-based approaches, and decision-support tools with data-science partners. Assess their usefulness and potential integration into electronic health records and clinical workflows. Contribute clinical outcomes and healthcare-use data to evaluate the clinical utility and cost-effectiveness of biomarker-guided treatment, and develop training and patient information.

    Collaborative background and patient involvement

    Prof. Tadolini’s background includes consultancy for the WHO Global TB Programme, coordination of the ERS/WHO TB Consilium and leadership within the Global TB Consilium. Her research activities include participation in the IRENE national NTM registry and global experience in the introduction and monitoring of new MDR-TB drugs and regimens [4-5]. As President of Stop TB Italia ODV, she brings a civil-society perspective relevant to patient engagement, accessible communication and dissemination. We propose to involve patients in defining meaningful outcomes and acceptable monitoring procedures.

    We seek complementary partners in cardiology and multimorbidity, clinical pharmacology, pharmacogenomics, biomarker analysis, digital health and health economics to test approaches transferable beyond infectious diseases.

    <strong class="contribution-section-title">Selected publications</strong>

    Calcagno A, Coppola N, Sarmati L, Tadolini M, et al. Drugs for treating infections caused by non-tubercular mycobacteria… Infection. 2024;52:737–765. doi: 10.1007/s15010-024-02183-3

    Tadolini M, et al. Cardiac safety of extensively drug-resistant tuberculosis regimens including bedaquiline, delamanid and clofazimine. Eur Respir J. 2016;48:1527–1529 (correspondence). doi: 10.1183/13993003.01552-2016

    Riccardi N, et al. (including M Tadolini; on behalf of StopTB Italia). How We Treat Drug-Susceptible Pulmonary Tuberculosis: A Practical Guide for Clinicians. Antibiotics. 2023;12:1733. doi: 10.3390/antibiotics12121733

    Singh KP, et al.. Clinical standards for the management of adverse effects during treatment for TB. Int J Tuberc Lung Dis. 2023 Jul 1;27(7):506-519. doi: 10.5588/ijtld.23.0078. PMID: 37353868; PMCID: PMC10321364.

    Singh KP, et al.. Clinical standards for the management of adverse effects during treatment for TB. Int J Tuberc Lung Dis. 2023 Jul 1;27(7):506-519. doi: 10.5588/ijtld.23.0078. PMID: 37353868; PMCID: PMC10321364.

    4. Bellavia A, et al.; Global Tuberculosis Network and FAST-TB End-User Survey Group. Prioritising research topics identified by end-users for a successful and rapid uptake of new tuberculosis treatment regimens. Eur Respir J. 2026 Sep 8;68(3):2600989. doi: 10.1183/13993003.00989-2026. PMID: 42532544.'
