- id: laura-anderlucci--envhlth-02
  researcher_id: laura-anderlucci
  topic_id: horizon-hlth-2027-01-envhlth-02
  title: 'Laura Anderlucci: expertise for ENVHLTH-02'
  contribution: 'Our core expertise is in supervised and unsupervised classification, statistical modelling, multiview data integration, dimension reduction, synthetic data generation and causal inference. We develop methods for complex, high-dimensional and heterogeneous data, with applications to environmental exposures, omic data, the human exposome and health. A non exhaustive list of examples follows

    Clustering and heterogeneity. Develop model-based clustering methods to identify interpretable groups, disentangle different sources of heterogeneity and assess which variables contribute to each structure [1,2].

    Multiview data integration. Integrate complementary information from different sources or measurement domains [3]. Combine clinical, omics, environmental and sensor data while retaining common and source-specific patterns.

    Dimension reduction. Develop low-dimensional representations of high-dimensional data to support exploration, clustering and interpretation [1]. Extend these approaches to multivariate trajectories and functional data [4].

    Synthetic data generation. Develop and evaluate statistical generators, assessing distributional fidelity and preservation of dependence and group structure. Use synthetic datasets to benchmark methods and assess robustness across controlled scenarios.

    Complementary methods and validation. Record linkage and graphical models support data integration and dependence modelling [5,6]. Assess uncertainty and model stability, with documented and reproducible analytical workflows.

    Potential contribution. Contribute to or lead statistical methodology and joint analysis, from data representation and integration to model development, validation and reusable software.

    Related recent projects: H2020 MobilizeD, PNRR Heal, PNC Dare

    Selected references

    [1] Anderlucci L., Fortunato F., Montanari A. (2022). Journal of Classification, 39, 191–216. DOI: 10.1007/s00357-021-09403-7

    [2] Galimberti G., Manisi A., Soffritti G. (2018). Statistics and Computing, 28, 145–169. DOI: 10.1007/s11222-017-9723-0

    [3] Anderlucci L., Dallari S., Montanari A. (2023). CLADAG 2023, 34–37 (conference contribution).

    [4] Mori M., Anderlucci L. (2026). Advances in Data Analysis and Classification, 20, 877–901. DOI: 10.1007/s11634-026-00684-7

    [5] Redivo E. (2026). International Statistical Review. DOI: 10.1111/insr.70038

    [6] Ranciati S., Roverato A. (2024). Statistics and Computing, 34, 209. DOI: 10.1007/s11222-024-10513-6'
