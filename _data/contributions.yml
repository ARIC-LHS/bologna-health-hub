- id: barbara-zambelli--disease-08
  researcher_id: barbara-zambelli
  topic_id: horizon-hlth-2027-01-disease-08
  title: 'Barbara Zambelli: expertise for DISEASE-08'
  contribution: 'Our research group combines protein biochemistry, biophysics and bioinorganic chemistry to investigate molecular mechanisms relevant to therapeutic intervention. Our expertise encompasses recombinant protein production, protein–protein and protein–ligand interactions, enzyme activity and inhibition, metal homeostasis, and the structural and functional properties of intrinsically disordered regions.

    Our experimental capabilities include construct design, cloning and site-directed mutagenesis; recombinant expression in bacterial systems; chromatographic purification; and biochemical and biophysical characterisation using solution NMR spectroscopy, crystallography, isothermal titration calorimetry (ITC), circular dichroism, fluorescence spectroscopy and light scattering. These approaches enable the determination of binding affinity and stoichiometry, protein structure and oligomerisation, conformational changes and stability, and the functional consequences of molecular interactions.

    Our background includes extensive research on Helicobacter pylori urease, its accessory proteins and the nickel-dependent machinery required for enzyme activation. We have developed an in-cell screening approach targeting urease activity and maturation and investigated the protein interactions underlying urease activation.

    Within this topic, we could contribute to the mechanistic characterisation of existing antimicrobial candidates acting on metalloenzymes, metal acquisition or protein maturation pathways in eligible pathogens. Tasks could include recombinant target production; biochemical inhibition assays; analysis of metal binding and protein–protein interactions through kinetic and binding assays, and structural methods; mutational studies to test proposed mechanisms of action. Where relevant, our established urease assays could be adapted to distinguish effects on enzyme catalysis from effects on maturation. These activities would be undertaken with pathogen-specific microbiology partners to connect molecular findings with antimicrobial efficacy.

    <strong class="contribution-section-title">Relevant publications</strong>

    Tarsia C., Danielli A., Florini F., Cinelli P., Ciurli S., Zambelli B. (2018). Targeting Helicobacter pylori urease activity and maturation: In-cell high-throughput approach for drug discovery. Biochimica et Biophysica Acta – General Subjects, 1862, 2245–2253. https://doi.org/10.1016/j.bbagen.2018.07.020

    Carosella N., Brock K.P., Zambelli B., Musiani F., Sander C., Ciurli S. (2023). Functional contacts for activation of urease from Helicobacter pylori: an integrated approach using evolutionary couplings, in-cell enzymatic assays, and computational docking. Frontiers in Chemical Biology, 2, 1243564. https://doi.org/10.3389/fchbi.2023.1243564

    L. Mazzei; M. Cianci; S. Ciurli. Inhibition of urease by hydroquinones: a structural and kinetic study. Chem. Eur. J. 2022, 28, e202201770. https://doi.org/10.1002/chem.202201770

    L. Mazzei; S. Ciurli. Ureas. Encyclopedia of Inorganic and Bioinorganic Chemistry (A. Messerschmidt Ed.); John Wiley & Sons, Ltd. Chichester (UK), 2021, pp. 1-17. https://doi.org/10.1002/9781119951438.eibc2776

    L. Mazzei; M. N. Wenzel; M. Cianci; M. Palombo; A. Casini; S. Ciurli. Inhibition mechanism of urease by Au(III) compounds unveiled by X-ray diffraction analysis. ACS Med. Chem. Lett. 2019, 10, 564-570. https://doi.org/10.1021/acsmedchemlett.8b00585'
