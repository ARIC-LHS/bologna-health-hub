- id: alessandro-perin--tool-01
  researcher_id: alessandro-perin
  topic_id: horizon-hlth-2027-02-tool-01-two-stage
  title: 'Alessandro Perin: expertise for TOOL-01'
  contribution: 'Alessandro Perin, Head of the Neurosurgery Unit at IRCCS ISN, previously scientific director of the Besta NeuroSim Center (Carlo Besta Neurological Institute, Milan). He has coordinated prospective multicentre studies (STARS series; PASSION, an international prospective controlled trial; a European validation study with 92 neurosurgeons) and a randomised clinical trial, and works on image-guided and computer-assisted surgery.

    Giorgio Palandri leads the ISN programme for idiopathic normal pressure hydrocephalus (iNPH) and is PI of the Bologna PRO-Hydro prospective cohort (since 2015, about 400 patients; CSF biomarkers, wearable gait analysis, MRI/CT, tap and infusion tests, follow-up at 6 and 12 months after shunt). He has about 40 publications on hydrocephalus and is Bologna PI of STOP-iNPH, a seven-centre European study of prodromal iNPH coordinated by Uppsala University Hospital. He is President of the Hydrocephalus Society and Chair of the WFNS CSF Disorders Committee (from 2026).

    Team and partners, by biomarker domain

    Clinical phenotyping and cohorts: ISN/UNIBO Neurology (G. Giannini, S. Cevoli, P. Cortelli); Uppsala University Hospital (J. Virhammar, STOP-iNPH); Kuopio University Hospital (V. Leinonen, Kuopio NPH Registry, more than 1,100 patients with cortical biopsy and CSF).

    Fluid biomarkers: ISN CSF laboratory and biobank (P. Parchi, S. Baiardi; Alzheimer core biomarkers, α-synuclein RT-QuIC).

    Imaging biomarkers and AI: ISN Neuroradiology (L. Albini-Riccioli); UNIBO DEI (S. Diciotti; MRI harmonisation, trustworthy AI); UNIBO DISI (D. Evangelista, E. Loli Piccolomini; deep learning for CT); University Hospital Zurich (V.E. Staartjes; automated CT volumetry).

    Digital and physiological biomarkers: UNIBO DEI (L. Chiari, L. Palmerini, S. Mellone, A. Ferrari, R. Stagni, M.C. Bisi; Mobilise-D digital mobility outcomes) with ISN Rehabilitation (D. Milletti); University of Cambridge (M. and Z. Czosnyka) and Hospices Civils de Lyon (R. Manet) for CSF dynamics; Sheba Medical Center (S. Hassin-Baer) and QuantalX Neuroscience (SME) for TMS-EEG.

    Data integration, trustworthy AI and ethics: UNIBO DISI (A. Carbonaro; FHIR standards, credibility of ML predictors); UNIBO FaBiT (R. Fioresi, F. Zanchetta; machine learning); UNIBO DIMEC (G. Castellani; health big data); UNIBO Law (S. Zullo; ethics); CINECA (high-performance computing, federated analysis).

    Activities the group can carry out in the topic

    Mapping of clinical, fluid, imaging, digital and physiological biomarkers of iNPH, with sex-disaggregated analysis.

    Development of AI models on existing high-quality cohorts (PRO-Hydro, Kuopio, STOP-iNPH), with MRI harmonisation, FHIR-based standardisation and federated analysis.

    Multimodal integration with explainability, bias assessment and credibility assessment of ML predictors.

    Clinical validation in independent cohorts and prospective multicentre studies led from the EU.

    Regulatory and exploitation work, building on Mobilise-D experience with EMA qualification of digital endpoints and on SME partners.

    <strong class="contribution-section-title">Selected publications</strong>

    Riccietti C, ..., Palandri G, Parchi P, Giannini G. AD core biomarkers and cognitive profiles in iNPH: the Bologna PRO-Hydro study. Fluids Barriers CNS 2026. doi:10.1186/s12987-026-00836-z

    Giannini G, ..., Palandri G, Leinonen V, Parchi P. In vivo Lewy body and β-amyloid copathologies in iNPH. Fluids Barriers CNS 2022. doi:10.1186/s12987-022-00368-2

