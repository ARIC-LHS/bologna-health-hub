- id: silvia-bordoni--disease-08
  researcher_id: silvia-bordoni
  topic_id: horizon-hlth-2027-01-disease-08
  title: 'Silvia Bordoni: expertise for DISEASE-08'
  contribution: 'Antimicrobial resistance (AMR) is a global public heath challenge. The reaction of 2-picolinaldehyde (C5H4NCHO) with 2-aminophenol (OH)C6H4(NH2) affords high yield of the related PAP, namely 2-[(pyridin-2-ylmethylene)amino]phenol (C5H4N)C=N(C6H4OH)]. This imino-ligand gives a variety of distinct unexpected coordination products by replacement of H and PPh₃ ligands, exhibiting either chelate (k2-N,X ;X=N,O) or pincer-shaped (k3-N,O,X; X=N,C) complexes by reaction with [Ru(H)₂CO(PPh₃)₃]. One features hydrogenation of the coordinated imine, tentatively attributed to H₂ generated during complex formation. Another unexpected product contains an amide function instead of the imine. This transformation occurs under mild conditions in the presence of trace O₂ and is consistent with XPS experiments, as evidenced by the reduction of Ru(II) to Ru(0). A variety of different Schiff base ligands (SB) containing R=Pyrrole or Indole (electron donor moieties) and R’=Phenyl, Phenol units
    have been previously synthesized1 in our laboratories, featuring κ²(N,N) and K3-(N,N,O) imine chelators. Among them, single-crystal X-ray diffraction studies for three selected compounds have been also performed. These Ru(II)-complexes, bearing bidentate or tridentate ligands, showed good stability under physiological conditions (PBS solution for 48 h), highlighting their potential to pharmacological applications2,3,4,5.Preliminary antimicrobial assays revealed some of them to inhibit the growth of Escherichia coli, while one compound showed slight activity against S. aureus. 1-S. Bordoni et al., Ru-based Schiff bases for antimicrobial applications, presented at Cogico 2026,19-22 May,Bologna;. 2-R.Malav, S.Ray RSC Adv.,(2025), 15, pp.22889; 3-R.Ramadan et al Nature (2025) 15:pp.18546; 4-Nyang’ate, S. et al. AJAC 2025, 13 (6), 152–163.; 5-G. Drius PON XXXVII PhD thesis in Nanoscience - University of Bologna (2025), Supervised by S. Bordoni)

    <strong class="contribution-section-title">Expertise</strong>

    Our group has recently synthesized ruthenium complexes bearing HSA (hydroxy stearic acids of the type (C18H36O3) coordinating the carboxyl unit to the Ru(H)(CO)(PPh₃)₂ fragment as κ2-(O,O) chelate. The crucial biological activity is devoted to the relative OH position in the carbon chain. In fact the hydroxy unit in the odd position (5-, 7-, 9-, 11-HSA) show inhibitor activity against various human tumour cell lines (ovarian IGROV1), cervical (HeLa), colon (HT29) (Drius G.; Bordoni S.; Boga C.; Monari M.; Fiori J.; Esposito E.; Zalambani C.; Pincigher L.; Farruggia G.; Calonghi N.; Micheletti G., Synthesis and Antiproliferative Insights of Lipophilic Ru(II)-Hydroxy Stearic Acid Hybrid Species, «MOLECULES», 2023, 28, Article number: 4051, pp. 4051 – 4067)

    Dynamic behaviour has been observed in the case of carboxy-pyrrole ligand coordination. Prolonged acetonitrile refluxing promotes an unusual k2(O,O)- k2(N,O)- dynamic chelate conversion, forming a neutral, stable, air- and moisture- insensitive, solvento-species k2(N,O)-[Ru(MeCN)(CO)(pyrCHO)(PPh3)2]. Antibacterial and antifungal trials on Gram-positive (Staphylococcus aureus), Gram-negative (Escherichia coli), and Candida albicans were further carried out. Drius G.; Tarroni R.; Birchmeier M.; Parolin C.; Boga C.; Monari M.; Bordoni S., Unpredictable Dynamic Behaviour of Ruthenium Chelate Pyrrole Derivatives, Molecules, 2024, 29, pp. 1 17

    New perspectives, given by metal coordination of old drugs, represent an attractive strategy for the development of novel therapeutic formulations, offering enhanced bioactivity. In this context, five well-known non-steroidal anti-inflammatory drugs (NSAIDs) were employed to the same metal skeleton, thereby selectively affording neutral k2-(O,O)–chelate complexes via molecular hydrogen release. Two complexes coordinating diclofenac and aspirin were investigated by single-crystal X-ray diffraction (SCXRD), whereas preliminary biological studies were conducted on the Ru–salicylic acid species and ibuprofen. The former showed promising antiproliferative activity against HeLa cancer cells. Bordoni, Silvia; Monari, Magda; Boga, Carla; Moro, Federico; Drius, Giacomo, Ru-Based NSAIDs as Potential Anticancer Therapeutics, «MOLECULES», 2026, 31, Article number: 589, pp. 1-13 .'
