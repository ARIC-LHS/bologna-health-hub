- id: marco-candela--envhlth-02
  researcher_id: marco-candela
  topic_id: horizon-hlth-2027-01-envhlth-02
  title: 'Marco Candela: expertise for ENVHLTH-02'
  contribution: 'We are experts in the characterization of human and environmental microbiomes and could contribute to the proposal by investigating the microbiome as a dynamic biological component of the exposome that is sensitive to climate change. Specifically, we could monitor climate-related changes in microbial community structure, function, and resilience, as well as potential increases in pathobionts, opportunistic pathogens, virulence factors, and antimicrobial resistance genes. These microbial features could be evaluated as biomarkers of environmental exposure and potential indicators of health risk. In addition, our anaerobic cultivation facilities would enable the isolation and functional characterization of relevant microbial strains and communities under controlled conditions. Their biological effects could then be assessed through functional assays using cell culture models, allowing us to investigate host-microbiome interactions, barrier integrity, inflammatory responses,
    and other mechanisms potentially linking climate-related microbial alterations to human health outcomes.

    <strong class="contribution-section-title">Projects</strong>

    Circles – H2020 EU project - https://cordis.europa.eu/project/id/818290

    InBLOOM – PRIN PNRR 2022 – https://www.unibo.it/it/ricerca/progetti-e-iniziative/prin/19070/1907030540/30911

    UNSEEN – FIS 3 – https://www.unibo.it/it/ricerca/progetti-e-iniziative/fondo-italiano-per-la-scienza-fis/44055/44056/59672'
