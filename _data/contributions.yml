- id: igor-diemberger--tool-01
  researcher_id: igor-diemberger
  topic_id: horizon-hlth-2027-02-tool-01-two-stage
  title: 'Igor Diemberger: expertise for TOOL-01'
  contribution: 'Clinical and translational expertise

    Our group combines heart failure research, clinical electrophysiology and biomedical technology to investigate disease trajectories and individual responses to pharmacological and device-based treatments. We offer expertise in congestion assessment, atrial fibrillation, cardiac resynchronisation, implantable-device remote monitoring and validation of wearable physiological signals.

    Proposed contribution to the consortium

    Clinical study design. Define cardiovascular use cases, patient phenotypes and endpoints for worsening heart failure, hospitalisation and treatment response; support multicentre protocols, recruitment and longitudinal follow-up.

    Multimodal biomarkers. Contribute clinical expertise to the integration of circulating markers, including natriuretic peptides, with ECG, echocardiographic and functional assessments, wearable signals and implantable-device measurements.

    Reliable data for AI. Provide clinical annotation, reference-standard adjudication and signal-quality assessment; help harmonise longitudinal records and identify artefacts, missingness and clinically meaningful changes.

    AI interpretation and validation. Work with AI partners applying established methods to define features and assess clinical plausibility, calibration, discrimination, subgroup bias and added value over usual care. Distinguish prediction of disease course from prediction of differential treatment benefit.

    Clinical translation. Contribute independent-cohort and prospective validation, decision-support workflow design, usability assessment and exploitation planning. Data reuse and recruitment scope will be agreed with participating centres.

    <strong class="contribution-section-title">Relevant projects</strong>

    BIOTOOL-CHF (Horizon Europe, GA 101095653): University of Bologna team lead and WP7 exploitation lead; biomarker-guided personalisation of diuretic therapy in heart failure. Project

    TRIGGER (Horizon Europe, GA 101057739): responsibility for CROSSCLAVIS and LONGCLAVIS studies linking climate and pollution exposure with cardiovascular events and wearable physiological measurements. Project

    REMEDY and MySIGN: leadership in multiparametric remote monitoring, integrating sensor devices and digital platforms for chronic disease management.'
