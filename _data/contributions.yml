  title: 'Luciano Potena: expertise for CARE-02'
  contribution: 'The two complementary clinical units manage patients with cardiovascular multimorbidity, complex medication regimens and advanced heart failure, providing relevant clinical settings for research on adverse drug reactions (ADRs), personalised prescribing and medication optimisation.

    CARDIOVASCULAR INTERNAL MEDICINE (U.O.C.)

    Clinical expertise: management of complex internal medicine patients with cardiovascular disease, heart failure, hypertension, multimorbidity and polypharmacy; assessment of treatment-related complications, renal function and treatment tolerability.

    Potential project activities: prospective recruitment and phenotyping of multimorbid inpatients and outpatients; structured medication reconciliation and review; assessment of potentially inappropriate prescribing and prescription cascades; monitoring of suspected ADRs and clinical outcomes; pragmatic evaluation of prescribing/deprescribing pathways in collaboration with clinical pharmacology specialists.

    Research background: an ongoing collaboration with hospital and university Clinical Pharmacology on research projects concerning polypharmacy, deprescribing and medication reconciliation in patients with heart failure (inpatient and outpatient settings). An observational heart-failure research programme has evaluated the relationship between in-hospital diuretic dosing, discharge prescriptions and clinical outcomes.

    ADVANCED HEART FAILURE AND TRANSPLANTATION (SSD)

    Clinical expertise: specialist care of patients with advanced heart failure and transplantation-related care, involving complex and frequently changing therapeutic regimens and close clinical and laboratory monitoring.

    Potential project activities: recruitment of high-risk advanced-heart-failure populations; longitudinal evaluation of medication burden, drug tolerability, renal/electrolyte safety and suspected ADRs; evaluation of personalised medication adjustment and deprescribing feasibility, where clinically appropriate; multidisciplinary implementation and assessment of safety-focused care pathways.

    Both units have experience in conducting EU funded projects.

    PROPOSED CONTRIBUTION TO A EUROPEAN CONSORTIUM

    The units could act as clinical recruitment and validation sites for observational and interventional studies; contribute to real-world evidence generation, ADR surveillance, clinical endpoint definition, and evaluation of implementation feasibility. Pharmacogenomic assays, AI-based decision support, health-economic modelling and regulatory work would require confirmation of local capabilities and/or dedicated consortium partners.

    <strong class="contribution-section-title">SELECTED PROJECTS / PUBLICATIONS / PATENTS</strong>

    Research collaboration on polypharmacy, deprescribing and medication reconciliation in heart failure — protocol under development

    Heart-failure diuretic optimisation and outcomes research'
