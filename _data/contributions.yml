    efgartigimod in kidney transplant recipients with antibody-mediated rejection. 6) BAXDUO-ARCTIC / BAXDUO-PACIFIC and ZENITH (AstraZeneca): Phase III clinical trials investigating combination therapies and targeted treatment strategies in chronic kidney disease, with particular relevance to patients with hypertension, complex comorbidities and multiple concomitant medications. Investigator-Initiated and Non-Profit Research Projects:We concluded and have ongoing projects that demonstrate complementary expertise in clinical phenotyping, biomarker research, personalised medicine and the longitudinal assessment of complex kidney disease populations'
