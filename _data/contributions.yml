- id: arrigo-francesco-giuseppe-cicero--disease-10
  researcher_id: arrigo-francesco-giuseppe-cicero
  topic_id: horizon-hlth-2027-01-disease-10
  title: 'Arrigo Francesco Giuseppe Cicero: expertise for DISEASE-10'
  contribution: 'Proposed concept | FAMILY-VASC: Intergenerational cardiovascular prevention through family-based cascade screening, age-appropriate vascular phenotyping and explainable artificial intelligence (AI). The Bologna clinic offers an estimated cohort of ~800 high-/very-high-CV-risk patients treated with PCSK9 inhibitors as potential index cases; eligibility, family links and consent will be verified.

    Topic-specific activities: Design and implement an equitable, evidence-based family cascade-screening and prevention pathway for eligible children, adolescents and young adults (1–24 years) among offspring and grandchildren, complemented by underserved populations recruited by international partners. Assess familial lipid disorders and cardiometabolic risk using family history, LDL-C/non-HDL-C, apoB/Lp(a) as appropriate, blood pressure, adiposity, lifestyle and routinely available clinical data; support personalized counselling, referral, follow-up and evaluation of reach, uptake and sustainability.

    Experimental / clinical methodology: At suitably equipped sites, harmonize non-invasive flow-mediated dilation (FMD) and pulse-wave velocity (PWV) protocols with pediatric age-related interpretation, operator training, quality control and blinded central reading where feasible. Treat vascular readouts as exploratory research phenotypes, not stand-alone diagnostic indications. Evaluate implementation effectiveness, feasibility, health equity and cost-effectiveness using a pragmatic multicentre hybrid implementation design.

    Responsible AI innovation: Co-develop clinician-supervised, interpretable models with digital-health partners to integrate family history, standard risk factors and vascular research markers for risk-phenotype stratification and screening prioritization. Benchmark against conventional rules, externally validate across sites, monitor calibration/fairness and avoid autonomous clinical decisions. Apply GDPR-compliant governance and age-appropriate assent/parental consent.

    International partnership capacity: Established collaborations within the International Lipid Expert Panel (ILEP) and membership of the European Regional Federation of the International Atherosclerosis Society (IAS) offer pathways to identify lipid clinics, pediatric/family-medicine teams, implementation researchers and data-science partners across Europe and beyond. Consortium participation is prospective, not yet confirmed.

    Relevant projects / clinical research: Brisighella Heart Study (longitudinal cardiovascular prevention); AVATAR dyslipidemia-clinic registry; Global Pulse Wave Velocity Study Group; Homozygous Familial Hypercholesterolaemia International Registry; participation in lipid-lowering trials including LAPLACE-2, OSLER-2, GAUSS-2 and VICTORION-2P.

    Selected publications: Ruscica et al., J Am Heart Assoc 2017, PCSK9 and arterial stiffness, doi:10.1161/JAHA.117.005764; Cicero et al., Int J Cardiol 2019, diet and children with heterozygous FH, doi:10.1016/j.ijcard.2019.05.069; Cicero et al., BioFactors 2022, non-invasive endothelial reactivity in young volunteers, doi:10.1002/biof.1839; Silla et al., Antioxidants 2023, evolocumab and arterial stiffness, doi:10.3390/antiox12030578; Lu et al./Global PWV Study Group, EBioMedicine 2023, doi:10.1016/j.ebiom.2023.104619.'
