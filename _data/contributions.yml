- id: milena-raffi--disease-10
  researcher_id: milena-raffi
  topic_id: horizon-hlth-2027-01-disease-10
  title: 'Milena Raffi: expertise for DISEASE-10'
  contribution: '<strong class="contribution-section-title">Expertise and experience</strong>

    Our research combines human and exercise physiology with school-based health promotion, focusing on physical activity, nutrition education and the prevention of sedentary lifestyles in children and adolescents. We bring practical experience in working with young people, schools and families to translate prevention knowledge into everyday behaviours and support health literacy.

    <strong class="contribution-section-title">Relevant project and methods</strong>

    Prof. Milena Raffi coordinates the DUSE project (Counteracting diabetes using interdisciplinary educative programs, funded by the EU4H program), which addresses the prevention of type 2 diabetes and cardiovascular disease through interdisciplinary educational programmes for children and adolescents aged 8-16. DUSE integrates physical education, nutrition education and family involvement. Methods include student and parent questionnaires, student food diaries and digital tools supporting engagement and data collection. This experience provides educational protocols, school partnerships and practical knowledge of delivering prevention activities in different educational contexts.

    <strong class="contribution-section-title">Potential contribution to the topic</strong>

    As a consortium partner, we can contribute to adapting and implementing evidence-based physical activity and nutrition interventions in schools and community settings, drawing on DUSE experience. Activities can include structured movement opportunities, active classroom breaks, strategies to reduce sedentary time, and age-appropriate nutrition and health education. We can support the involvement of young people, teachers and families in adapting content and delivery to local needs, and contribute to training educators and preparing accessible educational materials.

    Our contribution can also include assessing physical activity, sedentary behaviour, dietary habits and health knowledge through questionnaires, food diaries and repeated assessments. In collaboration with implementation research partners, we can contribute to monitoring participation, adherence, acceptability and barriers to uptake, and to assessing how interventions can be integrated into school routines and sustained over time.

    Networks and relevance to underserved populations

    The DUSE network includes partners in Bulgaria, Ukraine and Romania with experience involving disadvantaged populations and refugees. These connections offer opportunities to explore context-sensitive adaptation, community engagement and equitable access to prevention. Our contribution would focus on school-age children and adolescents, linking physiological expertise and practical educational experience to the implementation and scale-up of interventions with established supporting evidence.'
