- id: rita-stagni--disease-14
  researcher_id: rita-stagni
  topic_id: horizon-hlth-2027-02-disease-14-two-stage
  title: 'Rita Stagni: expertise for DISEASE-14'
  contribution: '<strong class="contribution-section-title">Expertise</strong>

    We have developed an unobtrusive technological approach for the quantitative assessment and longitudinal monitoring of biomarkers of motor function and motor control for assessment in ambulatory and real-life conditions. The proposed approach can support and integrate other biomarkers in pathology progression and therapeutic intervention efficacy assessment.

    The approach (TRL 6-7) is easy to implement, user friendly, and little time-consuming, to guarantee applicability and acceptance, as well as applicable in large populations using off-the-shelf low-cost technology. Data are acquired by clinicians or carers in daily living conditions. Quantitative metrics are extracted as biomarkers of functional and control performance, providing a characterization of the subject motor function.

    <strong class="contribution-section-title">What we can provide</strong>

    - Design protocols for data acquisition and biomarkers of motor function and control assessment for specific clinical assessment based on minimal measurement approach in different ambulatory and ecological conditions. The tests require minimal instrumentation and have been developed to be delivered by physicians or carers, depending on the specific need.

    - Extract biomarkers of motor function and control; characterize target population with respect to available reference values.

    <strong class="contribution-section-title">Relevant publications</strong>

    Bisi M. C., Stagni R. (2025). IMU-based linear and nonlinear metrics for the characterization of fine motor development in early childhood. GAIT & POSTURE

    Bisi M. C., Stagni R. (2025). Is IMU- alternative to GRF-based posturography? A comparative assessment on young healthy adults. GAIT & POSTURE

    Bisi M. C., …, Stagni R. (2022). Quantitative Characterization of Motor Control during Gait in Dravet Syndrome Using Wearable Sensors: A Preliminary Study. SENSORS

    Bisi M. C., Stagni R. (2020). Human motor control: Is a subject-specific quantitative assessment of its multiple characteristics possible? A demonstrative application on children motor development. MEDICAL ENGINEERING & PHYSICS

    Masini A., … Stagni R., Bisi M. C., … (2020). A multiple targeted research protocol for a quasi-experimental trial in primary school children based on an active break intervention: The imola active breaks (i-move) study. INTERNATIONAL JOURNAL OF ENVIRONMENTAL RESEARCH AND PUBLIC HEALTH

    Bisi, M. C., Stagni, R. (2018). Changes of human movement complexity during maturation: quantitative assessment using multiscale entropy. COMPUTER METHODS IN BIOMECHANICS AND BIOMEDICAL ENGINEERING

    Bisi, M. C., Stagni, R. (2016). Complexity of human gait pattern at different ages assessed using multiscale entropy: From development to decline. GAIT & POSTURE, vol. 47, p. 37-42

    Bisi, M. C., Stagni, R. (2016). Development of gait motor control: What happens after a sudden increase in height during adolescence?. BIOMEDICAL ENGINEERING ONLINE

    Bisi, M. C., Riva, F., Stagni, R. (2014). Measures of gait stability: Performance on adults and toddlers at the beginning of independent walking. JOURNAL OF NEUROENGINEERING AND REHABILITATION, vol. 11, p. 1-8.

    <strong class="contribution-section-title">Funded projects</strong>

    UcanAct - Urban ACTion for cancer prevention: adult and senior citizens practice physical activity within public urban green spaces to prevent cancer diseases, ERASMUS-SPORT-2021-SCP, Total Funding 400.000,00 euro, Operative CIRI SDV University of Bologna.

    PRIN 2022 - I-DASY: Instrument-based holistic DigitAl twinS for monitoring neuro-motor developmental trajectorY in preterm infants (2 Partners, funding 172.000,00 euros, Duration 24 months)'
