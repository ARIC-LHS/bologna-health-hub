- id: federico-ravaioli--disease-01
  researcher_id: federico-ravaioli
  topic_id: horizon-hlth-2027-02-disease-01-two-stage
  title: 'Federico Ravaioli: expertise for DISEASE-01'
  contribution: 'Expertise and research resources

    Clinical hepatology expertise in metabolic dysfunction-associated steatotic liver disease (MASLD/MASH) and compensated advanced chronic liver disease (cACLD). The group integrates non-invasive liver and spleen stiffness measurements, steatosis assessment, CT-derived muscle and adipose tissue measures, bioelectrical impedance analysis, laboratory markers and nutritional and behavioural data. Resources include the ongoing BOMASH prospective/retrospective cohort (NCT06813508), longitudinal clinical and imaging data, standardised acquisition protocols and pseudonymised REDCap data management. Experience includes diagnostic-accuracy and individual-patient-data meta-analyses, multicentre biomarker validation and clinical evaluation of AI-based tools.

    <strong class="contribution-section-title">Proposed contribution to the topics</strong>

    Clinical partner for the design and evaluation of healthcare interventions in MASLD/MASH, including lifestyle, nutritional and metabolic management. Potential tasks include patient phenotyping and recruitment, definition of clinically meaningful outcomes, longitudinal assessment of liver health and body composition, and evaluation of treatment response within multidisciplinary care pathways.

    <strong class="contribution-section-title">Suggested consortium role and relevant projects</strong>

    Lead or co-lead the MASLD/cACLD clinical use case, cohort characterisation and clinical validation tasks. Seeking collaboration with AI/data-science teams, intervention and implementation researchers, and SMEs. Relevant studies: BOMASH; ELASTOVOD, a prospective multicentre diagnostic trial; and international collaborations on non-invasive tests and portal hypertension.

    <strong class="contribution-section-title">Selected publications</strong>

    Giuffrè M, ..., Ravaioli F, et al. Validation of a pan-ELastography Machine-learning (ELM) score to predict clinically significant portal hypertension in cACLD. J Hepatol 2026. doi:10.1016/j.jhep.2026.06.032

    Ravaioli F, et al. Diagnostic accuracy of the FAST score: systematic review and meta-analysis. Gut, 2023. doi:10.1136/gutjnl-2022-328689

    Govaere O, et al. (including Ravaioli F). Transcriptomic profiling across the NAFLD spectrum. Sci Transl Med, 2020. doi:10.1126/scitranslmed.aba4448

    Dajti E, Ravaioli F, et al. Accuracy of spleen stiffness measurement for the diagnosis of CSPH in cACLD: systematic review and IPD meta-analysis. Lancet Gastroenterol Hepatol 2023. doi:10.1016/S2468-1253(23)00150-4'
