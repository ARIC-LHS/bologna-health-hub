- id: rita-fioresi--tool-01
  researcher_id: rita-fioresi
  topic_id: horizon-hlth-2027-02-tool-01-two-stage
  title: 'Rita Fioresi: expertise for TOOL-01'
  contribution: 'Our research group develops advanced mathematical and artificial intelligence methodologies for the analysis of complex, heterogeneous data, with particular emphasis on biomedical applications, multimodal learning, geometric deep learning and generative AI.

    Our expertise combines differential and information geometry, Graph Neural Networks (GNNs), representation learning, autoencoders and generative models to develop robust, interpretable and data-efficient computational approaches.

    In the context of predictive biomarker discovery for chronic non-communicable diseases, our group can contribute to the following activities:

    Multimodal biomedical data integration: Development of Graph Neural Networks, including geometric and sheaf-based architectures, to integrate heterogeneous clinical, imaging, molecular, genomic and physiological data, capturing complex relationships across different modalities.

    AI-based predictive biomarker identification: Development of machine learning methodologies for identifying disease-associated patterns and predictive signatures, combining representation learning, feature selection and interpretable AI approaches to support the prediction of disease progression and treatment response.

    Geometric representation learning: Investigation of the intrinsic geometry of biomedical datasets and learned latent spaces, using differential and information-geometric methods to improve dimensionality reduction, representation quality, robustness and interpretability.

    Generative AI and incomplete data: Development of autoencoder-based architectures, conditional generative models and geometric flow-matching methodologies for missing-modality reconstruction, data augmentation and generation of synthetic biomedical representations, particularly in small-cohort and data-scarce settings.

    Analysis of physiological signals and medical data: Development of deep learning and autoencoder-based methodologies for signal quality assessment, anomaly detection and extraction of informative representations from biomedical signals, including photoplethysmography (PPG).

    Robustness, explainability and validation: Investigation of model reliability, uncertainty, generalisation across heterogeneous datasets and interpretability, in collaboration with clinical partners, to assess the potential clinical relevance of AI-derived biomarkers.

    The group is particularly interested in developing geometry-aware, multimodal and interpretable AI methodologies capable of combining molecular, imaging, physiological and clinical information to identify candidate biomarkers and support personalised predictions of disease evolution and therapeutic response.'
