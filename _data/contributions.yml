- id: tullia-gallina-toschi--envhlth-02
  researcher_id: tullia-gallina-toschi
  topic_id: horizon-hlth-2027-01-envhlth-02
  title: 'Tullia Gallina Toschi: expertise for ENVHLTH-02'
  contribution: 'The research group of Chemistry, instrumental and sensory analyses of foods has extensive expertise in the development and application of conventional and innovative instrumental and sensory analytical techniques for the assessment of food quality, authenticity, and characterization of food products. In relation to this topic, the expertise of the research group contributes to addressing the call’s expected outcomes by investigating how climate-driven changes in food composition and quality may influence the human exposome and related health outcomes. Specifically, the research group deals with the study of climate-related modifications in food matrices that may affect human health, with particular expertise in lipid oxidation processes. The group also has experience in the analysis of minor bioactive compounds, such as phenolic compounds, using HPLC and spectrophotometric methods. This expertise is relevant to understanding how climate-related exposures may dynamically
    alter the human exposome; for example, climate conditions can lead to a reduction of bitter and pungency sensory attributes, known to be linked to phenolic compounds in olive oil, thus lowering the beneficial health effects. In line with the call objective of integrating climate-relevant social determinants of health, the research group also integrates sensory analysis and consumer questionnaires to assess consumer knowledge, perception and behavioral responses to changes in food habits and quality related to environment and climate. Moreover, the research group has also experience in the analysis of some food contaminants (e.g., PEG) and in the determination of synthetic antioxidants (e.g., BHT), compounds that are increasingly used in the food system as a consequence of climate change. I am the Coordinator for Area 2 – Technology in the Scientific Committee of the UNIBO Center “Alma Mater Institute on Healthy Planet,” which could support collaboration and participation in this project
    proposal.

    <strong class="contribution-section-title">Relevant research projects</strong>

    PRIMA CIPROMED –CIrcular and Inclusive utilisation of alternative PROteins in the MEDiterranean value chains (2023–2026; Grant Agreement n. 2231; LACASS research team: partner).

    PRIMA SUSTAINOLIVE – Novel approaches to promote the SUSTAInability of OLIVE cultivation in the Mediterranean (2019–2022; Grant Agreement n. 1811; LACASS research team: partner).

    H2020 OLEUM - Advanced solutions for assuring the overall authenticity and quality of olive oil (2016-2021; Grant Agreement n. 635690; LACASS research team: coordinator)

    <strong class="contribution-section-title">Relevant publications</strong>

    Zantedeschi, S., Grigoletto, I., Tura, M., Bendini, A., Valli, E., Paglianti, A., Alberini, F., Montante, G., Cavani, F., Tabanelli, T., Maraldi, M., Valenti, F., Maggiore, I., Setti, L., El Yamani, S., Contin, A., & Gallina Toschi, T. (2026). The Olive Oil Mill as Circular Hub. European Journal of Lipid Science and Technology, 128(9), e70140.

    Manzaneda, A. J., Kyriakides, T. C., Panagos, P., Cerdá, A., Calero, J., Landa, B. B., Kourgialas, N. N., Moret S., Villanueva, A. J., Alewell, C., Díez, C. M., Kabourakis, E. M., Polo, J. A., Rey, P. J., Gallina Toschi, T., Murgado-Armenteros, E. M., Pereira, J. A., La Rubia, M. D., Gkisakis, V., García-Reyes, J. F., Martín-García, J. M., Bajoub, A., Stavrianakis, G., & Barroso, J. B. (2026). Building Climate-Resilient Mediterranean Olive Systems: Integrating Soil, Water, Carbon, Biodiversity, and Innovation for a Sustainable Future. npj Sustainable Agriculture, 4(1), 70.

    Menna, I., Roccatello, R., Tura, M., Valli, E., Gallina Toschi, T., & Bendini, A. (2026). Italian consumers’ responses to pasta formulated with alternative protein sources: an online questionnaire. International Journal of Gastronomy and Food Science, 101617.

    Tucci, R., Cevoli, C., Bendini, A., Barbieri, S., Casadei, E., Valli, E., & Gallina Toschi, T. (2025). Changes in the volatile profile, fruity flavor, and rancidity in virgin olive oils during storage by targeted and untargeted analytical approaches. Foods, 14(11), 1884.

    Semeniuc, C. A., Mandrioli, M., Urs, M. J., & Gallina Toschi, T. (2024). Quality and authenticity of saffron and sensory aspects. International Journal of Gastronomy and Food Science, 38, 101067.

    Semeniuc, C. A., Mandrioli, M., Podar, A. S., Ranga, F., Socaciu, M. I., Ionescu, S. R., Fogarasi, M., Fărcaș, A. C., Gallina Toschi, T., Vodnar, D. C., & Socaci, S. A. (2024). Fats extracted from oil press cakes, fish meat, and chicken hearts as potential CoQ10 supplements. Waste and Biomass Valorization, 15(7), 4337-4352.

    Grigoletto, I., García Salas, P., Valli, E., Bendini, A., Ferioli, F., Pasini, F., Villasclaras, F. S., García-Ruiz, R., & Gallina Toschi, T. (2024). HPLC-MS/MS phenolic characterization of olive pomace extracts obtained using an innovative mechanical approach. Foods, 13(2), 285.

    Lazzarini, C., Casadei, E., Valli, E., Tura, M., Ragni, L., Bendini, A., & Gallina Toschi, T. (2022). Sustainable drying and green deep eutectic extraction of carotenoids from tomato pomace. Foods, 11(3), 405.'
